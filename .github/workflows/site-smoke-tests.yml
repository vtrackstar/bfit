name: BFit site smoke tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check pages, inline scripts, JSON and internal links
        run: node scripts/audit-site.mjs
      - name: Check editorial copy, guide summaries and coaching intake message
        run: node scripts/editorial-smoke.mjs
      - name: Check Your First milestone contracts and release gates
        run: node scripts/audit-milestones.mjs
      - name: Validate athletic training workload data and Starter totals
        run: node scripts/audit-program-data.mjs
      - name: Install headless browser
        run: |
          npm install --no-save playwright @axe-core/playwright
          npx playwright install --with-deps chromium
      - name: Check desktop and mobile page loads
        run: node scripts/browser-smoke.mjs
      - name: Test hub release readiness (responsive, navigation, keyboard, accessibility)
        run: node scripts/hub-release.mjs
      - name: Test workout setup, browser saving and downloads
        run: node scripts/core-flows.mjs
      - name: Test guide layout and navigation refinements
        run: node scripts/guide-layout-flows.mjs
      - name: Test new-visitor paths and shared guide navigation
        run: node scripts/beginner-entry-flows.mjs
      - name: Check public guide, exercise library and inquiry URLs
        run: node scripts/public-links.mjs
      - name: Review public coaching form without submitting
        run: node scripts/coaching-form-readonly.mjs
      - name: Save screenshots for manual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bfit-qa-screenshots
          path: qa-screenshots/
          if-no-files-found: ignore

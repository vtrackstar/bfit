name: Mobility development checks
on:
  push:
    branches: ['feature/mobility-guide-workout']
  pull_request:
    paths:
      - 'guides/mobility/**'
      - 'guides/build-your-mobility/**'
      - 'scripts/mobility-engine-test.mjs'
      - 'scripts/mobility-browser-test.mjs'
      - 'guides/gamer-fit/**'
      - '.github/workflows/mobility-development.yml'
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/mobility-engine-test.mjs
      - run: node scripts/audit-exercise-library.mjs
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8080 > /tmp/bfit-http.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/ >/dev/null && break; sleep 1; done
          node scripts/mobility-browser-test.mjs
          node scripts/gamer-fit-audit.mjs

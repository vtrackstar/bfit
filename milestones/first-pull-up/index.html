arent 50%,#234e41 50%),linear-gradient(135deg,#234e41 50%,transparent 50%);background-position:calc(100% - 19px) 50%,calc(100% - 14px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:35px}textarea{min-height:100px}input[type=checkbox],input[type=radio]{width:21px;height:21px;flex-shrink:0}fieldset{padding:0;margin:18px 0;border:0;min-width:0}legend{font-weight:700;margin-bottom:8px}.choices{display:grid;gap:8px}.choices label,.tick{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);padding:12px;border-radius:10px;margin:0;font-weight:400}.choices label:has(input:checked){background:#e8eedd;border-color:var(--green)}details{border-top:1px solid var(--line);padding:14px 0}summary{font-weight:650;cursor:pointer}.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.repgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.timer{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.timer [role=timer]{font-variant-numeric:tabular-nums;font-weight:700;font-size:24px}svg{width:100%;max-height:240px}.burst{position:relative;overflow:hidden}.burst i{position:absolute;left:50%;top:55px;width:8px;height:8px;background:#a57413;border-radius:50%;animation:burst 1.2s ease-out both;pointer-events:none}@keyframes burst{to{transform:rotate(var(--a)) translateX(160px);opacity:0}}@media(prefers-reduced-motion:reduce){.burst i{display:none}}@media(max-width:600px){.two{grid-template-columns:1fr}nav a{padding:9px 11px}header{font-size:14px}}@media print{header,nav,button,.actions,.notice{display:none}.card{break-inside:avoid}body{background:white}}

'use strict';
const KEY='bfit-first-pullup-v1', METHODS=['machine','feet','band','none'], EFFORT=['easy','steady','hard','form'];
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const realDate=v=>typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v)&&Number.isFinite(Date.parse(v+'T12:00:00Z'))&&new Date(v+'T12:00:00Z').toISOString().slice(0,10)===v;
const fresh=()=>({schemaVersion:1,guide:'first-pull-up',profile:null,targets:[3,3],history:[],attempts:[],drafts:{},paused:false,recheck:false,formCount:0,topCount:0,suggest:false,milestone:false,singles:false,firstSet:null,archivedDrafts:[],breakOffer:'',reason:'Find the assistance that lets you practice with control.'});
function valid(s){const str=(v,n=300)=>typeof v==='string'&&v.length<=n, ints=(a,lo,hi)=>Array.isArray(a)&&a.length===2&&a.every(n=>Number.isInteger(n)&&n>=lo&&n<=hi);const profile=p=>p&&METHODS.slice(0,3).includes(p.method)&&str(p.setting)&&str(p.name)&&['solo','existing'].includes(p.mode)&&['1','2'].includes(p.days);return !!(s&&s.schemaVersion===1&&s.guide==='first-pull-up'&&(s.profile===null||profile(s.profile))&&ints(s.targets,1,5)&&['paused','recheck','suggest','milestone','singles'].every(k=>typeof s[k]==='boolean')&&(!s.singles||s.milestone)&&['formCount','topCount'].every(k=>Number.isInteger(s[k])&&s[k]>=0&&s[k]<=10000)&&(s.checkCount===undefined||(Number.isInteger(s.checkCount)&&s.checkCount>=0&&s.checkCount<=3))&&(s.archivedDrafts===undefined||(Array.isArray(s.archivedDrafts)&&s.archivedDrafts.length<=5000&&s.archivedDrafts.every(d=>d&&typeof d==='object'&&Object.values(d).every(v=>typeof v==='string'&&v.length<=1000))))&&(s.reviewHistory===undefined||(Array.isArray(s.reviewHistory)&&s.reviewHistory.every(r=>r&&realDate(r.date)&&Number.isInteger(r.sessions)&&r.sessions>=8)))&&(s.returnPractice===undefined||typeof s.returnPractice==='boolean')&&(s.reviewed===undefined||(Number.isInteger(s.reviewed)&&s.reviewed>=0))&&(s.bridge===undefined||['help','controlled','drop','skip'].includes(s.bridge))&&(s.recovery===undefined||(s.recovery&&realDate(s.recovery.date)&&typeof s.recovery.done==='boolean'))&&(s.previous===undefined||(s.previous&&profile(s.previous.profile)&&ints(s.previous.targets,1,5)&&Number.isInteger(s.previous.attemptStart)&&s.previous.attemptStart>=0))&&str(s.reason,1000)&&str(s.breakOffer,50)&&Array.isArray(s.history)&&s.history.length<=5000&&s.history.every(r=>r&&str(r.date,40)&&Number.isFinite(Date.parse(r.date))&&profile(r.profile)&&ints(r.reps,0,100)&&ints(r.targets,0,5)&&EFFORT.includes(r.effort)&&['no','yes','unsure'].includes(r.pain)&&Number.isInteger(r.lowerings)&&r.lowerings>=0&&r.lowerings<=2&&(r.bridge===undefined||['skip','help','controlled','drop'].includes(r.bridge))&&str(r.note,1000)&&typeof r.singles==='boolean')&&Array.isArray(s.attempts)&&s.attempts.length<=10000&&s.attempts.every(a=>a&&str(a.date,40)&&Number.isFinite(Date.parse(a.date))&&profile(a.profile)&&Number.isInteger(a.reps)&&a.reps>=0&&a.reps<=3&&EFFORT.includes(a.effort)&&(a.pain===undefined||['no','yes','unsure'].includes(a.pain)))&&s.drafts&&typeof s.drafts==='object'&&!Array.isArray(s.drafts)&&Object.keys(s.drafts).every(k=>['setup','check','workout','certificate'].includes(k)&&s.drafts[k]&&typeof s.drafts[k]==='object'&&!Array.isArray(s.drafts[k])&&Object.entries(s.drafts[k]).every(([a,b])=>str(a,50)&&str(b,1000)))&&(s.firstSet===null||(s.firstSet&&realDate(s.firstSet.date)&&s.firstSet.reps===3))&&(!s.pending||profile(s.pending))&&(!s.milestoneDate||realDate(s.milestoneDate))&&(!s.milestone||(realDate(s.milestoneDate)&&s.milestoneDate<=today()))&&(s.lastPage===undefined||['start','setup','check','workout','progress','milestone','complete'].includes(s.lastPage)));}
let state=fresh(),storageOK=true;try{const raw=localStorage.getItem(KEY);if(raw){const parsed=JSON.parse(raw);if(valid(parsed))state=parsed;else storageOK=false;}}catch{storageOK=false;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}catch{storageOK=false;}if($('storage'))$('storage').textContent=storageOK?'Progress saves in this browser on this device. Download a backup before switching devices.':'Your progress could not be saved on this device. Download a backup before closing.';}
function msg(s){$('message').textContent=s;}
function go(p){if(location.hash==='#'+p)render();else location.hash=p;}
function methodName(p){return {machine:'Assisted pull-up machine',feet:'Feet-assisted pull-up',band:'Band-assisted pull-up'}[p?.method]||'Choose assistance';}
function setupLabel(p){return `${methodName(p)} · ${p.setting}${p.name?' · '+p.name:''}`;}
function choices(name,title,options){return `<fieldset><legend>${title}</legend><div class="choices">${options.map(([v,l])=>`<label><input ${name==='bridge'?'':'required'} ${name==='bridge'&&v==='skip'?'checked':''} type="radio" name="${name}" value="${v}"><span>${l}</span></label>`).join('')}</div></fieldset>`;}
const efforts=[['easy','Smooth throughout. I completed the full movement without swinging, and several more reps felt possible.'],['steady','Controlled throughout. I completed the full movement without swinging and lowered slowly each time.'],['hard','The reps slowed a lot or felt forced.'],['form','I swung, shortened the movement, or dropped down.']];
function timer(){return `<div class="timer"><button type="button" data-action="timer">Start 2-minute rest</button><span id="clock" role="timer" aria-live="off" aria-label="Rest time remaining">2:00</span><button type="button" data-action="stopTimer">Reset</button></div><small>Rest longer if you need it. A short sound plays when the timer ends if your browser allows it.</small>`;}
function goal(){return `<p>Start hanging still, with your feet off the ground and arms straight. Use an overhand grip, with your hands around shoulder width and thumbs wrapped around the bar. Pull until your chin clears the bar, then lower under control to straight arms.</p><p>Keep your legs relaxed and still. Reach the top by pulling your body up, without kicking or stretching your neck to reach the bar. Let your shoulders move naturally; don’t force a painful stretch at the bottom.</p>`;}
function diagram(){return `<svg viewBox="0 0 600 230" role="img" aria-label="Simple position diagram: straight arms at the bottom, chin above the bar at the top. This diagram shows the goal positions, not assistance setup."><g fill="none" stroke="#234e41" stroke-width="8" stroke-linecap="round"><path d="M35 35H270M335 75H570"/><circle cx="150" cy="104" r="17"/><path d="M150 123V171M150 131L105 39M150 131L195 39M150 171L133 210M150 171L167 210"/><circle cx="450" cy="43" r="17"/><path d="M450 62V143M450 83L411 106L395 79M450 83L489 106L505 79M450 143L433 183M450 143L467 183"/></g><g fill="#173d36" font-family="system-ui" font-size="16"><text x="80" y="228">Arms straight</text><text x="369" y="219">Chin above the bar</text></g></svg>`;}
function bridgeHelp(){return `<details><summary>Build toward lowering without help</summary><p>Use this for one of today’s two lowering sets. Place a stable platform under a secure bar so you can step into the top position and put your feet down again safely. Ask gym staff to help if needed.</p><p>Start with your chin above the bar. Keep your feet supported as you lower toward straight arms over about three seconds. Over time, use a little less leg help. Only lift your feet away when you can control the descent and safely return them to support. Stop if you drop or feel pain.</p><p>When you can lower through the full movement without help for about three seconds, and hanging still feels comfortable, you can try one dead-hang pull-up on a fresh day after warming up. If you cannot pull yourself up yet, keep practicing with assistance.</p><p>That first attempt replaces your first working set. If you cannot complete the pull-up, rest, then do one assisted set and finish for the day.</p></details>`;}
function demos(){const clips=[['PHdHnZcbsB8','Pull-up technique','PureGym','Start hanging still and lower slowly until your arms are straight.'],['wFj808u2HWU','Assisted machine setup','PureGym','Ask gym staff to show you the steps and moving pad before your first set.'],['JpsiZGnlQ_4','Band assistance','PureGym','Check the band and attachment. Use a stable step and get help entering and leaving the band.'],['Ml-Mihv1nQ4','Foot assistance and slow lowerings','Citizen Athletics','This longer tutorial covers several progressions. Follow the set counts and three-second lowering in this guide.']];return `<details><summary>Watch the demonstrations</summary><p>Videos by PureGym and Citizen Athletics. Choose the setup you use.</p>${clips.map(([id,title,creator,note])=>`<section><h3>${title}</h3><p>${note}</p><iframe style="width:100%;aspect-ratio:16/9;border:0" loading="lazy" title="${title} by ${creator}" src="https://www.youtube-nocookie.com/embed/${id}" referrerpolicy="strict-origin-when-cross-origin" allow="encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe><p><a href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener">Watch on YouTube · ${creator}</a></p></section>`).join('')}</details>`;}
function help(){return `<details><summary>Show the movement and coaching cues</summary>${diagram()}${goal()}<p><b>One cue:</b> Pull smoothly. Keep your legs relaxed and still.</p><p>If you swing, stop and reset with more assistance. If your grip opens or you cannot lower under control, end the set. Breathe throughout the repetition.</p><p>For the assisted machine, follow its instructions for stepping on and off the moving pad. For foot assistance, use a secure bar and a stable platform that lets your feet stay supported. For bands, check their condition and attachment, and use a setup you can enter and leave safely. Ask gym staff to show you unfamiliar equipment.</p></details><details><summary>How to practice a hold and slow lowering</summary><p>Use assistance to reach the top. Hold your chin above the bar for about one second, then take about three seconds to lower to straight arms. Keep your feet, band, or machine helping throughout as needed. Use help to return to the top.</p><p>Each set is one controlled lowering. Rest about two minutes between sets. If you start dropping, add assistance. If that still doesn’t help, skip the extra lowerings today.</p></details>`;}
function checksToday(){return state.attempts.filter(a=>{const d=new Date(a.date);return d.getFullYear()===new Date().getFullYear()&&d.getMonth()===new Date().getMonth()&&d.getDate()===new Date().getDate();}).length;}
function previousButton(){return state.previous&&!state.paused?'<p><button data-action=previous>Return to my previous assistance</button></p>':'';}
function archiveDraft(){if(Object.keys(state.drafts.workout||{}).length){state.archivedDrafts=state.archivedDrafts||[];state.archivedDrafts.push({...state.drafts.workout});}delete state.drafts.workout;}
function readinessCurrent(s){if(s.paused||s.recheck||s.returnPractice||s.singles||s.milestone||s.bridge!=='controlled')return false;const r=s.history.slice().reverse().find(r=>r.bridge==='controlled'&&r.pain==='no');if(!r)return false;const age=Date.now()-Date.parse(r.date);return age>=0&&age<14*864e5;}
function workoutPlan(s){const recovery=s.recovery?.date===today();return {targets:recovery?[0,s.targets[1]]:s.targets.slice(),loweringSets:s.singles||recovery||s.returnPractice?0:2,loweringReps:1,holdSeconds:1,loweringSeconds:3,restSeconds:120};}
function advance(s,r){s.firstSet=null;s.suggest=false;if(r.pain!=='no'){s.paused=true;s.bridge='help';s.reason='Practice is paused. Stop here and review the guidance before trying again.';return;}if(s.recovery?.date===today()){s.recovery.done=true;s.reason='Your remaining practice is saved. Keep your usual targets next visit.';return;}if(r.effort==='form'){s.formCount++;s.topCount=0;s.recheck=s.formCount>=2;s.reason=s.recheck?'Position changed in two sessions. Use more assistance and repeat the short check.':'Keep the same targets next time. Add assistance if you need it to keep control.';return;}if(s.returnPractice){s.returnPractice=false;s.topCount=0;s.reason='Return session saved. Repeat these targets next time before adding repetitions.';return;}s.formCount=0;const met=r.reps.every((n,i)=>n>=s.targets[i]);if(!met||r.effort==='hard'){s.topCount=0;s.reason='Repeat these targets. Rest longer, or use more assistance if the reps feel forced.';return;}const cap=s.singles?3:5;if(s.targets.every(n=>n===cap)){s.topCount++;s.suggest=!s.singles&&s.topCount>=2;s.reason=s.singles?'You are building controlled unassisted repetitions. Keep these targets or choose your next goal.':s.suggest?'You completed two sets of five with control twice. Try slightly less assistance, then repeat the short check.':'Repeat two sets of five with control once more before trying less assistance.';}else{const i=s.targets.indexOf(Math.min(...s.targets));s.targets[i]++;s.topCount=0;s.reason=s.singles?'Your next targets include one more unassisted repetition.':'Your next targets include one more repetition. Keep the same assistance.';}if(r.effort==='easy'&&!s.singles){s.suggest=true;s.reason+=' Since this felt easy, you can also try slightly less assistance at your next check.';}}
function progressText(s){const lines=['BFit · Your First Pull-Up','Training record',''];s.attempts.forEach(a=>lines.push(`${a.date.slice(0,10)} · Starting practice`,setupLabel(a.profile),`Repetitions: ${a.reps} · ${efforts.find(e=>e[0]===a.effort)?.[1]}`,`Pain reported: ${a.pain||'Not recorded in this older check'}`,''));(s.archivedDrafts||[]).forEach(d=>{lines.push('Earlier unfinished practice (not counted as a session)');for(const [k,label] of [['r1','Set one reps'],['r2','Set two reps'],['lowerings','Slow-lowering sets'],['note','Notes'],['changeNote','Assistance change']])if(d[k])lines.push(label+': '+d[k]);lines.push('');});s.history.forEach(r=>{lines.push(`${r.date.slice(0,10)} · ${r.singles?'Unassisted':'Assisted'} practice`,r.singles?'Overhand dead-hang pull-ups':setupLabel(r.profile),`Reps completed: ${r.reps.join(' / ')} · Targets: ${r.targets.join(' / ')}`,`Slow-lowering sets: ${r.lowerings}`,`Effort: ${efforts.find(e=>e[0]===r.effort)?.[1]}`,`Pain reported: ${r.pain}`);if(r.bridge)lines.push('Platform lowering: '+({skip:'Usual setup',help:'Foot-supported',controlled:'Controlled without help for about 3 seconds',drop:'Needed more help'}[r.bridge]||r.bridge));if(r.note)lines.push('Notes: '+r.note);lines.push('');});if(s.milestone)lines.push('First dead-hang pull-up recorded: '+s.milestoneDate);if(s.drafts.workout&&Object.keys(s.drafts.workout).length)lines.push('An unfinished workout is saved in your backup. It is not counted as a completed session.');return lines.join('\n');}
let page='start',tick=null,timerEnd=0,audioContext=null,importCandidate=null;
function render(){page=location.hash.slice(1)||state.lastPage||'start';if(!['start','setup','check','workout','progress','milestone','complete'].includes(page))page='start';state.lastPage=page;$('nav').innerHTML=[['start','Start'],['setup','Starting check'],...(state.profile?[['workout','Workout']]:[]),['progress','Progress']].map(([p,l])=>`<a class="button" href="#${p}" ${page===p?'aria-current="page"':''}>${l}</a>`).join('');let html='';
if(page==='start')html=`<section class="card accent"><span class="eyebrow">Your first…</span><h1>Pull-Up</h1><p>Build toward one pull-up from a dead hang. A dead hang is the starting position: hang still from the bar with your arms straight and your feet off the ground. I’ll help you choose enough assistance to practice, then reduce that help as you get stronger.</p><a class="button primary" href="#${state.profile?'workout':'setup'}">${state.profile?'Continue my practice':'Find my starting point'}</a><p><small>Designed by Bryan · NSCA-CSCS, NASM-CPT</small></p></section><section class="card"><h2>What you’ll work on</h2><p>Practice twice a week, with at least a day between sessions. Allow about 15–20 minutes. If once a week fits your schedule, use the same session order.</p><p>Start with two sets of three assisted pull-ups. Build toward two sets of five with control. Do that twice, then try slightly less assistance. If the sets feel easy, you can try less assistance sooner.</p><p>Brief holds and slow lowerings help you practice the parts of the movement. We’ll review after eight saved sessions. That’s about four weeks at twice a week, and longer if you train less often. There is no deadline for your first pull-up.</p><p>If you have a current injury or have been advised to limit exercise, get guidance about this movement before starting. Stop if it hurts.</p>${help()}</section><details><summary>Why this approach?</summary><p>I built this plan around assisted pull-ups, brief holds, and slow lowerings. Your logged workouts help you decide when to use less assistance.</p><p><a href="https://pubmed.ncbi.nlm.nih.gov/38247962/" target="_blank" rel="noopener">Vigouroux and Devise, 2024</a> studied different pulling methods in advanced climbers, not first-time beginners. <a href="https://strengthandconditioning.org/jasc-31-3/3828-original-scientific-research-study-the-effects-of-elastic-band-assistance-during-pull-ups" target="_blank" rel="noopener">Piper and colleagues’ band-assistance study</a> found more repetitions with assistance in a single session; it did not test time to a first pull-up.</p></details><section class="card">${demos()}</section>`;

$('view').addEventListener('click',e=>{const link=e.target.closest('a[href^="#"]');if(link&&link.getAttribute('href')===location.hash){e.preventDefault();render();return;}const a=e.target.closest('[data-action]')?.dataset.action;if(!a)return;if(a==='attempted'&&!state.paused&&!state.recheck&&!state.singles){archiveDraft();state.firstSet=null;state.recovery={date:today(),done:false};state.drafts.workout={r1:'0',note:'Tried one unassisted pull-up before the assisted set.'};save();render();}if(a==='previous'&&state.previous&&!state.paused){const p=state.previous,used=state.attempts.length-p.attemptStart;state.profile=p.profile;state.targets=p.targets;state.suggest=false;state.recheck=false;state.pending=null;state.firstSet=null;archiveDraft();if(used>0)state.recovery={date:today(),done:used>=2};delete state.previous;state.reason=used>=2?'Your checks counted as today’s practice. Use your previous assistance next visit.':'Previous assistance restored. Any harder check counts toward today’s work.';save();go('workout');}if(a==='review'){state.reviewed=Math.floor(state.history.filter(r=>r.pain==='no'&&r.reps.some(v=>v>0)).length/8)*8;state.reviewHistory=state.reviewHistory||[];state.reviewHistory.push({date:today(),sessions:state.reviewed});save();render();}if(a==='showLog'){const box=$('copyLog');box.hidden=false;box.value=progressText(state);box.focus();box.select();}if(a==='timer')startTimer();if(a==='stopTimer')stopTimer();if(a==='backup')downloadFile('BFit-Pullup-Backup.json',JSON.stringify(state,null,2),'application/json');if(a==='log')downloadFile('BFit-Pullup-Training-Log.txt',progressText(state),'text/plain');if(a==='pause'){state.paused=true;state.bridge='help';state.reason='You paused practice. Your unfinished workout remains in your backup.';save();render();}if(a==='return'){archiveDraft();state.firstSet=null;state.returnPractice=true;state.bridge='help';state.breakOffer=state.history.at(-1).date;state.targets=state.singles?[1,1]:[3,3];state.recheck=!state.singles;state.topCount=0;state.suggest=false;state.reason='Return session: use enough assistance for three controlled repetitions. Skip the extra lowerings for this return session.';save();go(state.singles?'workout':'setup');}if(a==='singles'){if(state.singles){go('workout');return;}if(!state.milestone||state.paused){go('workout');return;}state.singles=true;state.targets=[1,1];state.firstSet=null;state.recheck=false;if(!state.profile)state.profile={method:'feet',setting:'Not used during unassisted practice',name:'',mode:'solo',days:'2'};archiveDraft();save();go('workout');}if(a==='confirmRestore'&&importCandidate){state=importCandidate;importCandidate=null;save();go('progress');render();msg('Backup restored.');}if(a==='cancelRestore'){importCandidate=null;$('restoreConfirm').textContent='Restore cancelled. Your current record is unchanged.';}});
$('view').addEventListener('change',async e=>{if(e.target.id!=='restore')return;const f=e.target.files[0];if(!f)return;try{if(f.size>3000000)throw Error();const parsed=JSON.parse(await f.text());if(!valid(parsed))throw Error();importCandidate=parsed;$('restoreConfirm').innerHTML='<p>Replace the record on this device with this backup? Download your current backup first if you want to keep it.</p><button data-action="confirmRestore">Replace with this backup</button> <button data-action="cancelRestore">Cancel</button>';}catch{importCandidate=null;msg('This is not a supported pull-up backup. Your current record is unchanged.');}});
function jpegPDF(bytes,width,height){
 const enc=new TextEncoder(),parts=[],offsets=[0];let size=0;const push=x=>{const v=typeof x==='string'?enc.encode(x):x;parts.push(v);size+=v.length;};
 push('%PDF-1.4\n');const obj=(n,body)=>{offsets[n]=size;push(n+' 0 obj\n'+body+'\nendobj\n');};
 obj(1,'<< /Type /Catalog /Pages 2 0 R >>');obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');obj(3,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 792 612] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>');
 offsets[4]=size;push('4 0 obj\n<< /Type /XObject /Subtype /Image /Width '+width+' /Height '+height+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+bytes.length+' >>\nstream\n');push(bytes);push('\nendstream\nendobj\n');
 const stream='q 792 0 0 612 0 0 cm /Im0 Do Q';obj(5,'<< /Length '+stream.length+' >>\nstream\n'+stream+'\nendstream');const start=size;push('xref\n0 6\n0000000000 65535 f \n');for(let i=1;i<=5;i++)push(String(offsets[i]).padStart(10,'0')+' 00000 n \n');push('trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+start+'\n%%EOF');return new Blob(parts,{type:'application/pdf'});
}
function certificateCanvas(name,date){const c=document.createElement('canvas');c.width=2376;c.height=1836;const x=c.getContext('2d');x.scale(3,3);x.fillStyle='#f8f6ee';x.fillRect(0,0,792,612);x.strokeStyle='#234e41';x.lineWidth=3;x.strokeRect(25,25,742,562);x.strokeStyle='#b59a54';x.lineWidth=1;x.strokeRect(35,35,722,542);x.textAlign='center';x.fillStyle='#234e41';const line=(text,y,size,font='Georgia')=>{x.font=size+'px '+font;x.fillText(text,396,y);};line('BFit',93,33,'sans-serif');line('CERTIFICATE OF COMPLETION',144,14,'sans-serif');line('Your First Pull-Up',197,39);line('Presented to',242,13,'sans-serif');let size=36;x.font=size+'px Georgia';while(x.measureText(name).width>640&&size>14){size--;x.font=size+'px Georgia';}x.fillText(name,396,292);x.strokeStyle='#b59a54';x.beginPath();x.moveTo(160,310);x.lineTo(632,310);x.stroke();line('For completing your first dead-hang pull-up',352,19);line('and the practice that brought you here.',380,17);line(date,424,17,'sans-serif');line('Bryan | NSCA-CSCS, NASM-CPT',489,15,'sans-serif');line('BFit Training',513,13,'sans-serif');line('Self-recorded achievement',549,11,'sans-serif');return c;}
function downloadCertificate(name){if(!state.milestone)return;const date=new Date(state.milestoneDate+'T12:00:00').toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'}),c=certificateCanvas(name,date),binary=atob(c.toDataURL('image/jpeg',.95).split(',')[1]),bytes=Uint8Array.from(binary,v=>v.charCodeAt(0));downloadFile('BFit-First-Pullup-Certificate.pdf',jpegPDF(bytes,c.width,c.height),'application/pdf');msg('Your certificate is ready. If it opens in a preview, use Share or Save to Files.');}
window.addEventListener('hashchange',()=>{msg('');render();});render();

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Your First Pull-Up · BFit</title><style>
:root{--bg:#f3f1e9;--ink:#173d36;--muted:#546960;--line:#cbd5cb;--green:#234e41;--accent:#dcee92;--paper:#fffefa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,sans-serif}header{background:var(--green);color:#fff;padding:16px max(18px,calc((100% - 960px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px}header a{color:white}header b{font-size:26px}main{max-width:960px;margin:auto;padding:22px 18px 70px}nav{position:sticky;top:0;z-index:2;display:flex;gap:8px;background:var(--bg);padding:12px 0;flex-wrap:wrap}button,.button{font:inherit;display:inline-block;border:1px solid var(--line);border-radius:10px;padding:11px 16px;background:var(--paper);color:var(--ink);cursor:pointer;min-height:46px;text-decoration:none}button.primary,.button.primary,nav a[aria-current=page]{background:var(--green);color:white}button:disabled{opacity:.55;cursor:not-allowed}a{color:var(--green)}:focus-visible{outline:3px solid #a66c15;outline-offset:3px}h1{font-size:clamp(38px,7vw,64px);line-height:1.05;letter-spacing:-2px;margin:14px 0 22px}h2{font-size:29px;line-height:1.2}h3{font-size:21px}p{margin:12px 0 18px}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,4vw,30px);margin:18px 0}.accent{background:var(--accent)}.muted,small{color:var(--muted)}small{font-size:14px}.eyebrow{font-size:14px;text-transform:uppercase;letter-spacing:1.5px;font-weight:750}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.notice{padding:14px 18px;background:#fff0d4;border-left:4px solid #a66c15;border-radius:6px}.status{padding:14px;background:#e8eedd;border-radius:10px}.metric{font-size:40px;font-weight:750}label{display:block;font-weight:650;margin:14px 0 6px}input,select,textarea{font:inherit;color:var(--ink);background:white;border:1px solid #8d9f92;border-radius:8px;padding:12px;width:100%;min-width:0}select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#234e41 50%),linear-gradient(135deg,#234e41 50%,transparent 50%);background-position:calc(100% - 19px) 50%,calc(100% - 14px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:35px}textarea{min-height:100px}input[type=checkbox],input[type=radio]{width:21px;height:21px;flex-shrink:0}fieldset{padding:0;margin:18px 0;border:0;min-width:0}legend{font-weight:700;margin-bottom:8px}.choices{display:grid;gap:8px}.choices label,.tick{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);padding:12px;border-radius:10px;margin:0;font-weight:400}.choices label:has(input:checked){background:#e8eedd;border-color:var(--green)}details{border-top:1px solid var(--line);padding:14px 0}summary{font-weight:650;cursor:pointer}.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.repgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.timer{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.timer output{font-variant-numeric:tabular-nums;font-weight:700;font-size:24px}svg{width:100%;max-height:240px}.burst{position:relative;overflow:hidden}.burst i{position:absolute;left:50%;top:55px;width:8px;height:8px;background:#a57413;border-radius:50%;animation:burst 1.2s ease-out both;pointer-events:none}@keyframes burst{to{transform:rotate(var(--a)) translateX(160px);opacity:0}}@media(prefers-reduced-motion:reduce){.burst i{display:none}}@media(max-width:600px){.two{grid-template-columns:1fr}nav a{padding:9px 11px}header{font-size:14px}}@media print{header,nav,button,.actions,.notice{display:none}.card{break-inside:avoid}body{background:white}}
</style></head><body><header><b>BFit</b><a href="https://vtrackstar.github.io/bfit/">Training Hub</a></header><main><p class="notice">Draft for review · Training rules and demonstration videos still need a final coaching review.</p><nav id="nav" aria-label="Guide pages"></nav><p id="storage" class="muted"></p><div id="message" role="status" aria-live="polite"></div><div id="view"></div><noscript>This interactive guide needs JavaScript enabled.</noscript></main><script>
'use strict';
const KEY='bfit-first-pullup-v1', METHODS=['machine','feet','band','none'], EFFORT=['easy','steady','hard','form'];
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const fresh=()=>({schemaVersion:1,guide:'first-pull-up',profile:null,targets:[3,3],history:[],attempts:[],drafts:{},paused:false,recheck:false,formCount:0,topCount:0,suggest:false,milestone:false,singles:false,firstSet:null,archivedDrafts:[],breakOffer:'',reason:'Find the assistance that lets you practice with control.'});
function valid(s){const str=(v,n=300)=>typeof v==='string'&&v.length<=n, ints=(a,lo,hi)=>Array.isArray(a)&&a.length===2&&a.every(n=>Number.isInteger(n)&&n>=lo&&n<=hi);const profile=p=>p&&METHODS.slice(0,3).includes(p.method)&&str(p.setting)&&str(p.name)&&['solo','existing'].includes(p.mode)&&['1','2'].includes(p.days);return !!(s&&s.schemaVersion===1&&s.guide==='first-pull-up'&&(s.profile===null||profile(s.profile))&&ints(s.targets,1,5)&&['paused','recheck','suggest','milestone','singles'].every(k=>typeof s[k]==='boolean')&&(!s.singles||s.milestone)&&['formCount','topCount'].every(k=>Number.isInteger(s[k])&&s[k]>=0&&s[k]<=10000)&&(s.checkCount===undefined||(Number.isInteger(s.checkCount)&&s.checkCount>=0&&s.checkCount<=3))&&(s.archivedDrafts===undefined||(Array.isArray(s.archivedDrafts)&&s.archivedDrafts.length<=5000&&s.archivedDrafts.every(d=>d&&typeof d==='object'&&Object.values(d).every(v=>typeof v==='string'&&v.length<=1000))))&&str(s.reason,1000)&&str(s.breakOffer,50)&&Array.isArray(s.history)&&s.history.length<=5000&&s.history.every(r=>r&&str(r.date,40)&&Number.isFinite(Date.parse(r.date))&&profile(r.profile)&&ints(r.reps,0,100)&&ints(r.targets,1,5)&&EFFORT.includes(r.effort)&&['no','yes','unsure'].includes(r.pain)&&Number.isInteger(r.lowerings)&&r.lowerings>=0&&r.lowerings<=2&&str(r.note,1000)&&typeof r.singles==='boolean')&&Array.isArray(s.attempts)&&s.attempts.length<=10000&&s.attempts.every(a=>a&&str(a.date,40)&&Number.isFinite(Date.parse(a.date))&&profile(a.profile)&&Number.isInteger(a.reps)&&a.reps>=0&&a.reps<=3&&EFFORT.includes(a.effort))&&s.drafts&&typeof s.drafts==='object'&&!Array.isArray(s.drafts)&&Object.keys(s.drafts).every(k=>['setup','check','workout','certificate'].includes(k)&&s.drafts[k]&&typeof s.drafts[k]==='object'&&!Array.isArray(s.drafts[k])&&Object.entries(s.drafts[k]).every(([a,b])=>str(a,50)&&str(b,1000)))&&(s.firstSet===null||(s.firstSet&&str(s.firstSet.date,10)&&s.firstSet.reps===3))&&(!s.pending||profile(s.pending))&&(!s.milestoneDate||/^\d{4}-\d{2}-\d{2}$/.test(s.milestoneDate)));}
let state=fresh(),storageOK=true;try{const raw=localStorage.getItem(KEY);if(raw){const parsed=JSON.parse(raw);if(valid(parsed))state=parsed;else storageOK=false;}}catch{storageOK=false;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}catch{storageOK=false;}if($('storage'))$('storage').textContent=storageOK?'Progress saves in this browser on this device. Download a backup before switching devices.':'Your progress could not be saved on this device. Download a backup before closing.';}
function msg(s){$('message').textContent=s;}
function go(p){if(location.hash==='#'+p)render();else location.hash=p;}
function methodName(p){return {machine:'Assisted pull-up machine',feet:'Feet-assisted pull-up',band:'Band-assisted pull-up'}[p?.method]||'Choose assistance';}
function setupLabel(p){return `${methodName(p)} · ${p.setting}${p.name?' · '+p.name:''}`;}
function choices(name,title,options){return `<fieldset><legend>${title}</legend><div class="choices">${options.map(([v,l])=>`<label><input required type="radio" name="${name}" value="${v}"><span>${l}</span></label>`).join('')}</div></fieldset>`;}
const efforts=[['easy','Easy. I could clearly do several more.'],['steady','Controlled. I think I could do about two more.'],['hard','Hard. I had little or nothing left.'],['form','I swung, shortened the movement, or dropped down.']];
function timer(){return `<div class="timer"><button type="button" data-action="timer">Start 2-minute rest</button><output id="clock" aria-label="Rest time remaining">2:00</output><button type="button" data-action="stopTimer">Reset</button></div><small>Rest longer if you need it. A short sound plays when the timer ends if your browser allows it.</small>`;}
function goal(){return `<p>Start hanging still, with your feet off the ground and arms straight. Use an overhand grip, with your hands around shoulder width and thumbs wrapped around the bar. Pull until your chin clears the bar, then lower under control to straight arms.</p><p>Keep your legs quiet. Reach the top by pulling your body up, without kicking or stretching your neck to reach the bar. Let your shoulders move naturally; don’t force a painful stretch at the bottom.</p>`;}
function diagram(){return `<svg viewBox="0 0 600 230" role="img" aria-label="Simple position diagram: straight arms at the bottom, chin above the bar at the top. This diagram shows the goal positions, not assistance setup."><g fill="none" stroke="#234e41" stroke-width="8" stroke-linecap="round"><path d="M35 35H270M335 75H570"/><circle cx="150" cy="104" r="17"/><path d="M150 123V171M150 131L105 39M150 131L195 39M150 171L133 210M150 171L167 210"/><circle cx="450" cy="43" r="17"/><path d="M450 62V143M450 83L411 106L395 79M450 83L489 106L505 79M450 143L433 183M450 143L467 183"/></g><g fill="#173d36" font-family="system-ui" font-size="16"><text x="80" y="228">Arms straight</text><text x="369" y="219">Chin above the bar</text></g></svg>`;}
function help(){return `<details><summary>Show the movement and coaching cues</summary>${diagram()}${goal()}<p><b>One cue:</b> Pull smoothly. Keep your legs quiet.</p><p>If you swing, stop and reset with more assistance. If your grip opens or you cannot lower under control, end the set. Breathe throughout the repetition.</p><p>For the assisted machine, follow its instructions for stepping on and off the moving pad. For foot assistance, use a secure bar and a stable platform that lets your feet stay supported. For bands, check their condition and attachment, and use a setup you can enter and leave safely. Ask gym staff to show you unfamiliar equipment.</p></details><details><summary>How to practice a hold and slow lowering</summary><p>Use assistance to reach the top. Hold your chin above the bar for about one second, then take about three seconds to lower to straight arms. Keep your feet, band, or machine helping throughout as needed. Use help to return to the top.</p><p>Each set is one controlled lowering. Rest about two minutes between sets. If you start dropping, add assistance. If that still doesn’t help, skip the extra lowerings today.</p></details>`;}
function archiveDraft(){if(Object.keys(state.drafts.workout||{}).length){state.archivedDrafts=state.archivedDrafts||[];state.archivedDrafts.push({...state.drafts.workout});}delete state.drafts.workout;}
function workoutPlan(s){return {targets:s.targets.slice(),loweringSets:s.singles?0:2,loweringReps:1,holdSeconds:1,loweringSeconds:3,restSeconds:120};}
function advance(s,r){s.firstSet=null;if(r.pain!=='no'){s.paused=true;s.reason='Practice is paused. Stop the movement that caused pain, or that you are unsure about.';return;}if(r.effort==='form'){s.formCount++;s.topCount=0;s.recheck=s.formCount>=2;s.reason=s.recheck?'Position changed in two sessions. Use more assistance and repeat the short check.':'Keep the same targets next time. Add assistance if you need it to keep control.';return;}s.formCount=0;const met=r.reps.every((n,i)=>n>=s.targets[i]);if(!met||r.effort==='hard'){s.topCount=0;s.reason='Repeat these targets. Rest longer, or use more assistance if the reps feel forced.';return;}const cap=s.singles?3:5;if(s.targets.every(n=>n===cap)){s.topCount++;s.suggest=!s.singles&&s.topCount>=2;s.reason=s.singles?'You are building controlled unassisted repetitions. Keep these targets or choose your next goal.':s.suggest?'You completed two sets of five with control twice. Try slightly less assistance, then repeat the short check.':'Repeat two sets of five with control once more before trying less assistance.';}else{const i=s.targets.indexOf(Math.min(...s.targets));s.targets[i]++;s.topCount=0;s.reason='Your next targets include one more repetition. Keep the same assistance.';}if(r.effort==='easy'&&!s.singles){s.suggest=true;s.reason+=' Since this felt easy, you can also try slightly less assistance at your next check.';}}
function progressText(s){const lines=['BFit · Your First Pull-Up','Training record',''];s.attempts.forEach(a=>lines.push(`${a.date.slice(0,10)} · Starting practice`,setupLabel(a.profile),`Repetitions: ${a.reps} · ${efforts.find(e=>e[0]===a.effort)?.[1]}`,''));(s.archivedDrafts||[]).forEach(d=>{lines.push('Earlier unfinished practice (not counted as a session)');for(const [k,label] of [['r1','Set one reps'],['r2','Set two reps'],['lowerings','Slow-lowering sets'],['note','Notes'],['changeNote','Assistance change']])if(d[k])lines.push(label+': '+d[k]);lines.push('');});s.history.forEach(r=>{lines.push(`${r.date.slice(0,10)} · ${r.singles?'Unassisted':'Assisted'} practice`,r.singles?'Overhand dead-hang pull-ups':setupLabel(r.profile),`Reps completed: ${r.reps.join(' / ')} · Targets: ${r.targets.join(' / ')}`,`Slow-lowering sets: ${r.lowerings}`,`Effort: ${efforts.find(e=>e[0]===r.effort)?.[1]}`,`Pain reported: ${r.pain}`);if(r.note)lines.push('Notes: '+r.note);lines.push('');});if(s.milestone)lines.push('First dead-hang pull-up recorded: '+s.milestoneDate);if(s.drafts.workout&&Object.keys(s.drafts.workout).length)lines.push('An unfinished workout is saved in your backup. It is not counted as a completed session.');return lines.join('\n');}
let page='start',tick=null,timerEnd=0,audioContext=null,importCandidate=null;
function render(){page=location.hash.slice(1)||'start';if(!['start','setup','check','workout','progress','milestone','complete'].includes(page))page='start';$('nav').innerHTML=[['start','Start'],['setup','Starting check'],...(state.profile?[['workout','Workout']]:[]),['progress','Progress']].map(([p,l])=>`<a class="button" href="#${p}" ${page===p?'aria-current="page"':''}>${l}</a>`).join('');let html='';
if(page==='start')html=`<section class="card accent"><span class="eyebrow">Your first…</span><h1>Pull-Up</h1><p>Build toward one pull-up from a still hang. I’ll help you choose enough assistance to practice, then reduce that help as you get stronger.</p><a class="button primary" href="#${state.profile?'workout':'setup'}">${state.profile?'Continue my practice':'Find my starting point'}</a><p><small>Designed by Bryan · NSCA-CSCS, NASM-CPT</small></p></section><section class="card"><h2>What you’ll work on</h2><p>Practice twice a week, with at least a day between sessions. Allow about 15–20 minutes. If once a week fits your schedule, use the same session order.</p><p>Start with two sets of three assisted pull-ups. Build toward two sets of five with control. Do that twice, then try slightly less assistance. Easy sessions can earn an earlier check.</p><p>Brief holds and slow lowerings help you practice the parts of the movement. We’ll review after eight saved sessions. That’s about four weeks at twice a week, and longer if you train less often. There is no deadline for your first pull-up.</p><p>If you have a current injury or have been advised to limit exercise, get guidance about this movement before starting. Stop if it hurts.</p>${help()}</section><details><summary>Why this approach?</summary><p>Assisted repetitions let you practice the movement. Holds and controlled lowerings give you another way to work on it. The exact doses and progression rules here are coaching choices; this guide has not been tested as a complete program.</p><p><a href="https://pubmed.ncbi.nlm.nih.gov/38247962/" target="_blank" rel="noopener">Vigouroux and Devise, 2024</a> studied different pulling methods in advanced climbers, not first-time beginners. <a href="https://strengthandconditioning.org/jasc-31-3/3828-original-scientific-research-study-the-effects-of-elastic-band-assistance-during-pull-ups" target="_blank" rel="noopener">Piper and colleagues’ band-assistance study</a> found more repetitions with assistance in a single session; it did not test time to a first pull-up.</p></details>`;
if(page==='setup')html=`<section class="card"><h1>Find your starting assistance</h1><p>Choose equipment you can use safely. You’ll try up to three repetitions with help.</p><form id="setup" data-draft="setup">${choices('method','What can you use?',[['machine','An assisted pull-up machine'],['feet','A secure bar with my feet supported'],['band','A secure bar and pull-up bands'],['none','I don’t have a suitable setup yet']])}<div id="equipmentHelp" class="status">Choose your equipment to see setup instructions.</div><label for="setting">Assistance setting or description</label><input id="setting" name="setting" maxlength="300" placeholder="Example: 70 lb assistance, or both feet on a box"><p><small>Machine: record the assistance and units. Feet: describe the platform and how you use your legs. Bands: record brand and band combination; colors vary between brands.</small></p>${choices('pain','Does hanging or pulling hurt, or are you unsure?',[['no','No'],['yes','Yes'],['unsure','I’m unsure']])}<details><summary>Fit this around my other training</summary>${choices('mode','Do you already train your back or arms?',[['solo','This will be my pulling workout.'],['existing','I already do rows, pull-downs, or other pulling exercises.']])}${choices('days','How often will you use this guide?',[['2','Twice a week'],['1','Once a week']])}</details><button class="primary">Continue to movement check</button></form></section>`;
if(page==='check'){if(state.checkCount>=3&&state.recheck)html='<section class="card"><h2>Starting practice saved</h2><p>Finish here today. Next visit, choose more assistance and repeat the short check.</p><a class="button" href="#progress">View my practice</a></section>';else if(state.paused)html=pauseCard();else if(!state.pending)html='<section class="card"><h2>Choose your assistance first</h2><a class="button primary" href="#setup">Choose equipment</a></section>';else html=`<section class="card"><h1>Try three with help</h1><p>${esc(setupLabel(state.pending))}</p><p>Warm up with a few minutes of easy movement and gentle arm movements. Use generous assistance for one or two easy practice reps, then rest before the check.</p><p>First, hold the bar with your feet or the machine supporting you. Check that your grip feels secure and you can step off safely. Then use enough assistance to try three complete pull-ups. Stop before forcing a repetition.</p>${help()}${timer()}<form id="check" data-draft="check"><label for="checkReps">How many controlled repetitions did you finish?</label><input id="checkReps" name="reps" type="number" min="0" max="3" step="1" required inputmode="numeric">${choices('effort','How did those repetitions feel?',efforts)}${choices('pain','Any pain during that check?',[['no','No'],['yes','Yes'],['unsure','I’m unsure']])}<button class="primary">Save my starting check</button></form></section>`;}
if(page==='workout'){if(state.paused)html=pauseCard();else if(!state.profile||state.recheck)html=`<section class="card"><h2>Find your next starting point</h2><p>${esc(state.reason)}</p><a class="button primary" href="#setup">Check my assistance</a></section>`;else{const plan=workoutPlan(state),first=state.firstSet?.date===today(),last=state.history.at(-1),gap=last?(Date.now()-Date.parse(last.date))/864e5:0;html=`<section class="card"><span class="eyebrow">Today’s practice</span><h1>${state.singles?'Unassisted pull-ups':'Assisted pull-ups'}</h1><p>${state.singles?'Use a regular bar and your overhand dead-hang technique.':esc(setupLabel(state.profile))}</p>${gap>=14&&state.breakOffer!==last.date?`<div class="notice"><p>It has been at least two weeks. Start with an easier session and check how the movement feels.</p><button data-action="return">Use a return session</button></div>`:''}<p>Warm up with a few minutes of easy movement, gentle arm movements, and one or two easy assisted reps. Rest before your working sets.</p><div class="metric">${plan.targets.join(' / ')} reps</div><p>Two sets. Rest about two minutes between them, or longer if you need it. Stop each set while you could still do about two more controlled reps. For unassisted practice, end a set before a repetition becomes a struggle.</p>${first?'<p class="status">Your three starting-check reps count as set one today. Rest before set two.</p>':''}${state.profile.mode==='existing'?'<p class="status">Use these sets in place of your usual pull-up or pull-down work. The slow lowerings also count as pulling work. Keep your total pulling work manageable instead of adding this entire session on top.</p>':''}${!state.singles?'<p><b>Then: two slow-lowering sets, one repetition each.</b> Use help to reach the top, hold for about one second, and lower over about three seconds. Keep assistance as needed. Rest about two minutes between sets.</p>':'<p>Finish after these sets today. The unassisted repetitions replace your assisted work and extra lowerings.</p>'}${timer()}${help()}<form id="workout" data-draft="workout"><h2>Save today’s practice</h2><p>Enter 0 for a set you skipped.</p><div class="repgrid"><div><label for="r1">Set one reps</label><input id="r1" name="r1" type="number" required min="0" max="100" step="1" inputmode="numeric" ${first?'value="3"':''}></div><div><label for="r2">Set two reps</label><input id="r2" name="r2" type="number" required min="0" max="100" step="1" inputmode="numeric"></div></div>${!state.singles?choices('lowerings','How many slow-lowering sets stayed controlled?',[['0','0 sets'],['1','1 set'],['2','2 sets']]):'<input type="hidden" name="lowerings" value="0">'}${choices('effort','How did your pull-up sets feel?',efforts)}${choices('pain','Any pain during practice?',[['no','No'],['yes','Yes'],['unsure','I’m unsure']])}<p id="painHint" class="notice" hidden>Stop the exercise now. Save below to keep your entries and pause practice.</p>${choices('changed','Did you change assistance or machines during this session?',[['no','No'],['yes','Yes']])}<label for="changeNote">If you changed equipment or assistance, what did you use?</label><input id="changeNote" name="changeNote" maxlength="300"><label for="note">Anything you want to remember? <small>Optional</small></label><textarea id="note" name="note" maxlength="600"></textarea><button class="primary">Save session</button></form><div class="actions"><a class="button" href="#setup">Change assistance</a><button data-action="pause">Stop and pause practice</button></div></section>${state.suggest?'<section class="card accent"><h2>Ready to try less help?</h2><p>Try the next small reduction you can control. On a counterweighted machine, reduce the assistance setting. With feet or bands, choose a small, repeatable change. You can keep your current targets if you prefer.</p><a class="button primary" href="#setup">Check less assistance</a></section>':''}<section class="card"><h2>Thinking about your first pull-up?</h2><p>On a fresh day, after warming up, you can try one unassisted repetition if you can hang comfortably and control an unassisted lowering. These are coaching cues, not a guarantee. Use a safe way to get on and off the bar.</p><p>If you don’t get it, rest and return to assisted practice. Avoid repeated all-out attempts.</p><a class="button" href="#milestone">I completed a dead-hang pull-up</a></section>`;}}
if(page==='progress'){const n=state.history.filter(r=>r.pain==='no'&&r.reps.some(v=>v>0)).length;html=`<section class="card"><h1>Your progress</h1><div class="metric">${n} sessions</div><p>${n%8} of 8 toward your next review. Starting checks are saved separately.</p><p class="status">${esc(state.reason)}</p>${state.milestone?'<a class="button primary" href="#complete">View my certificate and voucher</a>':''}<div class="actions"><a class="button primary" href="#${state.profile?'workout':'setup'}">${state.profile?'View my workout':'Find my starting assistance'}</a></div>${n>=8?'<details open><summary>Review your last eight sessions</summary><p>Compare repetitions at the same assistance. Can you do more, use less help, or lower with better control? Keep going if practice is improving. If you are stuck, check your rest and other pulling work before adding more.</p><p>If control keeps breaking down, use more assistance. If practice hurts, pause. Missing sessions does not erase your progress.</p></details>':''}</section><section class="card"><h2>Keep your record</h2><p>Backups include your settings, saved sessions, and unfinished form entries. Your certificate name is included if you entered it. Keep the file somewhere private.</p><div class="actions"><button data-action="log">Download training log</button><button data-action="backup">Download backup</button></div><label for="restore">Restore a backup</label><input id="restore" type="file" accept=".json,application/json"><div id="restoreConfirm"></div></section><section class="card"><h2>Practice history</h2>${state.history.slice().reverse().map(r=>`<details><summary>${esc(r.date.slice(0,10))} · ${r.reps.join(' / ')} reps${r.pain!=='no'?' · paused':''}</summary><p>${r.singles?'Unassisted pull-ups':esc(setupLabel(r.profile))}</p><p>${esc(efforts.find(e=>e[0]===r.effort)?.[1])} Slow-lowering sets: ${r.lowerings}.</p>${r.note?`<p>${esc(r.note)}</p>`:''}</details>`).join('')||'<p>Your saved workouts will appear here.</p>'}${state.attempts.length?`<details><summary>${state.attempts.length} saved starting checks</summary>${state.attempts.map(a=>`<p>${esc(a.date.slice(0,10))} · ${esc(setupLabel(a.profile))} · ${a.reps} reps</p>`).join('')}</details>`:''}${state.archivedDrafts?.length?`<p>${state.archivedDrafts.length} earlier unfinished entries are retained in your backup and training log.</p>`:''}${Object.keys(state.drafts.workout||{}).length?'<p>An unfinished workout is saved. Return to Workout to finish it or include it in your backup.</p>':''}</section>`;}
if(page==='milestone')html=state.paused?pauseCard():`<section class="card"><h1>Record your first pull-up</h1>${goal()}<form id="milestone"><label class="tick"><input type="checkbox" required><span>I completed this repetition on a regular bar, with no foot, band, or machine assistance.</span></label><label for="milestoneDate">When did you do it?</label><input id="milestoneDate" name="date" type="date" required max="${today()}" value="${today()}"><button class="primary">Celebrate my first pull-up</button></form><p>Already able to do several? You can still record your achievement. The next practice option starts small; choose the Hub for a broader training plan.</p></section>`;

$('view').innerHTML=html;restoreDraft();if(page==='setup')equipmentHelp();save();const h=$('view').querySelector('h1,h2');if(h){h.tabIndex=-1;h.focus({preventScroll:true});}window.scrollTo(0,0);}
function pauseCard(){return `<section class="card"><h1>Let’s pause here</h1><p>Stop hanging or pulling if it hurts, or if you are unsure whether it is safe to continue. Your saved entries are still here.</p><p>If pain persists, recurs, or you’re unsure about returning, get advice from a qualified healthcare professional.</p><p>When you are ready to return without pain, repeat the short starting check. This is your own report; the guide cannot assess an injury.</p><a class="button primary" href="#setup">Review my starting point</a><a class="button" href="#progress">View my saved record</a></section>`;}
function restoreDraft(){const f=$('view').querySelector('[data-draft]');if(!f)return;const draft=state.drafts[f.dataset.draft]||{};for(const el of f.elements){if(!el.name)continue;if(draft[el.name]!==undefined){if(el.type==='radio')el.checked=el.value===draft[el.name];else el.value=draft[el.name];}}if(f.id==='setup'){if(!f.elements.mode.value)f.querySelector('[name=mode][value=solo]').checked=true;if(!f.elements.days.value)f.querySelector('[name=days][value="2"]').checked=true;}painHint();}
function draftForm(f){state.drafts[f.dataset.draft]=Object.fromEntries(new FormData(f));save();}
function painHint(){if($('painHint'))$('painHint').hidden=!['yes','unsure'].includes($('workout').elements.pain.value);}
function equipmentHelp(){const f=$('setup');if(!f)return;const m=f.elements.method.value;$('equipmentHelp').textContent={machine:'On a counterweighted machine, a higher assistance setting makes the exercise easier. Record the assistance and units. Ask gym staff to show you how to get on and off the moving pad.',feet:'Use a secure bar and stable foot support. Keep your feet in contact and let your legs help enough to control the whole repetition. Record the setup so you can repeat it.',band:'Use an undamaged pull-up band and a secure attachment. Choose enough help to control the full movement. Ask gym staff for help if you cannot safely enter and leave the band.',none:'You can start with pulling preparation, then return when you have suitable equipment.'}[m]||'Choose your equipment to see setup instructions.';}
$('view').addEventListener('input',e=>{const f=e.target.closest('[data-draft]');if(f)draftForm(f);if(f?.id==='setup')equipmentHelp();painHint();});
$('view').addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(!f.reportValidity())return;const d=Object.fromEntries(new FormData(f));if(f.dataset.draft)draftForm(f);
if(f.id==='setup'){if(d.pain!=='no'){state.paused=true;state.reason='Starting practice is paused because you reported pain or uncertainty.';save();go('workout');return;}state.paused=false;if(d.method==='none'){state.recheck=true;state.reason='No suitable pull-up setup yet. Use familiar, pain-free rows or pull-downs in your existing training, then return to check assistance when equipment is available.';save();$('view').innerHTML=`<section class="card"><h2>Start with pulling preparation</h2><p>${esc(state.reason)}</p><p>A row or pull-down can support your training, but it does not replace practicing on a bar. If you are new to gym equipment, ask staff to help you choose and learn a suitable movement.</p><a class="button primary" href="https://vtrackstar.github.io/bfit/">Explore training options</a><a class="button" href="#setup">Choose another setup</a></section>`;return;}if(!d.setting.trim()){msg('Add your assistance setting or a short description so you can repeat it.');return;}state.pending={method:d.method,setting:d.setting.trim(),name:'',mode:d.mode,days:d.days};state.checkCount=0;delete state.drafts.check;save();go('check');}
if(f.id==='check'){if(!state.pending||state.paused)return;const a={date:new Date().toISOString(),profile:{...state.pending},reps:Number(d.reps),effort:d.effort};state.attempts.push(a);state.checkCount=(state.checkCount||0)+1;if(d.pain!=='no'){state.paused=true;state.reason='The starting check stopped for pain or uncertainty.';save();go('workout');return;}if(a.reps===3&&['easy','steady'].includes(a.effort)){state.profile={...state.pending};state.targets=[3,3];state.singles=false;state.recheck=false;state.formCount=0;state.topCount=0;state.suggest=d.effort==='easy';state.firstSet={date:today(),reps:3};state.reason='Starting assistance saved. These three reps count as set one today.';state.pending=null;delete state.drafts.check;archiveDraft();save();go('workout');}else{delete state.drafts.check;state.recheck=true;state.reason='Starting practice saved. Next time, use more assistance and repeat the short check. Your attempts count as practice today.';save();if(state.checkCount>=3){go('progress');}else{$('view').innerHTML=`<section class="card"><h2>Use a little more help</h2><p>Rest at least two minutes. Increase the machine assistance or use more foot or band help. We’ll save up to three checks today before stopping this starting practice.</p>${timer()}<form id="adjust"><label for="adjustSetting">New assistance setting or description</label><input id="adjustSetting" name="setting" required maxlength="300"><button class="primary">Try with more assistance</button></form><a class="button" href="#progress">Finish practice for today</a></section>`;}}}
if(f.id==='adjust'){state.pending.setting=d.setting.trim();save();render();}
if(f.id==='workout'){if(state.paused||state.recheck||!state.profile)return;if(d.changed==='yes'&&!d.changeNote.trim()){msg('Describe the assistance you changed to before saving.');return;}const r={date:new Date().toISOString(),profile:{...state.profile},targets:state.targets.slice(),reps:[Number(d.r1),Number(d.r2)],effort:d.effort,pain:d.pain,lowerings:Number(d.lowerings),note:[d.changed==='yes'?'Assistance changed: '+d.changeNote.trim():'',d.note.trim()].filter(Boolean).join('\n'),singles:state.singles};state.history.push(r);advance(state,r);if(d.changed==='yes'){state.recheck=true;state.reason='Your session is saved with the assistance change. Repeat the short check before progressing on the new setup.';}delete state.drafts.workout;save();go(r.pain==='no'?'progress':'workout');}
if(f.id==='milestone'){if(state.paused)return;state.milestone=true;state.milestoneDate=d.date;save();go('complete');}
if(f.id==='certificate'){if(!d.name.trim()){msg('Enter the name you want on your certificate.');return;}downloadCertificate(d.name.trim());}
});
function downloadFile(name,data,type){const url=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);}
function stopTimer(){clearInterval(tick);tick=null;timerEnd=0;if($('clock'))$('clock').textContent='2:00';}
function startTimer(){stopTimer();try{audioContext=audioContext||new (window.AudioContext||window.webkitAudioContext)();audioContext.resume();}catch{}timerEnd=Date.now()+120000;tick=setInterval(()=>{const n=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));if($('clock'))$('clock').textContent=`${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`;if(n===0){clearInterval(tick);tick=null;msg('Rest timer finished. Start when you feel ready.');try{const o=audioContext.createOscillator(),g=audioContext.createGain();o.connect(g);g.connect(audioContext.destination);g.gain.value=.08;o.frequency.value=660;o.start();o.stop(audioContext.currentTime+.3);}catch{}}},250);}
$('view').addEventListener('click',e=>{const a=e.target.closest('[data-action]')?.dataset.action;if(!a)return;if(a==='timer')startTimer();if(a==='stopTimer')stopTimer();if(a==='backup')downloadFile('BFit-Pullup-Backup.json',JSON.stringify(state,null,2),'application/json');if(a==='log')downloadFile('BFit-Pullup-Training-Log.txt',progressText(state),'text/plain');if(a==='pause'){state.paused=true;state.reason='You paused practice. Your unfinished workout remains in your backup.';save();render();}if(a==='return'){state.breakOffer=state.history.at(-1).date;state.targets=state.singles?[1,1]:[3,3];state.recheck=!state.singles;state.topCount=0;state.suggest=false;state.reason='Return session: use enough assistance for three controlled repetitions. Keep the extra lowerings easy or skip them today.';save();go(state.singles?'workout':'setup');}if(a==='singles'){if(!state.milestone||state.paused){go('workout');return;}state.singles=true;state.targets=[1,1];state.firstSet=null;state.recheck=false;if(!state.profile)state.profile={method:'feet',setting:'Not used during unassisted practice',name:'',mode:'solo',days:'2'};archiveDraft();save();go('workout');}if(a==='confirmRestore'&&importCandidate){state=importCandidate;importCandidate=null;save();go('progress');render();msg('Backup restored.');}if(a==='cancelRestore'){importCandidate=null;$('restoreConfirm').textContent='Restore cancelled. Your current record is unchanged.';}});
$('view').addEventListener('change',async e=>{if(e.target.id!=='restore')return;const f=e.target.files[0];if(!f)return;try{if(f.size>3000000)throw Error();const parsed=JSON.parse(await f.text());if(!valid(parsed))throw Error();importCandidate=parsed;$('restoreConfirm').innerHTML='<p>Replace the record on this device with this backup? Download your current backup first if you want to keep it.</p><button data-action="confirmRestore">Replace with this backup</button> <button data-action="cancelRestore">Cancel</button>';}catch{importCandidate=null;msg('This is not a supported pull-up backup. Your current record is unchanged.');}});
function jpegPDF(bytes,width,height){
 const enc=new TextEncoder(),parts=[],offsets=[0];let size=0;const push=x=>{const v=typeof x==='string'?enc.encode(x):x;parts.push(v);size+=v.length;};
 push('%PDF-1.4\n');const obj=(n,body)=>{offsets[n]=size;push(n+' 0 obj\n'+body+'\nendobj\n');};
 obj(1,'<< /Type /Catalog /Pages 2 0 R >>');obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');obj(3,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 792 612] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>');
 offsets[4]=size;push('4 0 obj\n<< /Type /XObject /Subtype /Image /Width '+width+' /Height '+height+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+bytes.length+' >>\nstream\n');push(bytes);push('\nendstream\nendobj\n');
 const stream='q 792 0 0 612 0 0 cm /Im0 Do Q';obj(5,'<< /Length '+stream.length+' >>\nstream\n'+stream+'\nendstream');const start=size;push('xref\n0 6\n0000000000 65535 f \n');for(let i=1;i<=5;i++)push(String(offsets[i]).padStart(10,'0')+' 00000 n \n');push('trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+start+'\n%%EOF');return new Blob(parts,{type:'application/pdf'});
}
function certificateCanvas(name,date){const c=document.createElement('canvas');c.width=2376;c.height=1836;const x=c.getContext('2d');x.scale(3,3);x.fillStyle='#f8f6ee';x.fillRect(0,0,792,612);x.strokeStyle='#234e41';x.lineWidth=3;x.strokeRect(25,25,742,562);x.strokeStyle='#b59a54';x.lineWidth=1;x.strokeRect(35,35,722,542);x.textAlign='center';x.fillStyle='#234e41';const line=(text,y,size,font='Georgia')=>{x.font=size+'px '+font;x.fillText(text,396,y);};line('BFit',93,33,'sans-serif');line('CERTIFICATE OF COMPLETION',144,14,'sans-serif');line('Your First Pull-Up',197,39);line('Presented to',242,13,'sans-serif');let size=36;x.font=size+'px Georgia';while(x.measureText(name).width>640&&size>14){size--;x.font=size+'px Georgia';}x.fillText(name,396,292);x.strokeStyle='#b59a54';x.beginPath();x.moveTo(160,310);x.lineTo(632,310);x.stroke();line('For completing your first dead-hang pull-up',352,19);line('and the practice that brought you here.',380,17);line(date,424,17,'sans-serif');line('Bryan | NSCA-CSCS, NASM-CPT',489,15,'sans-serif');line('BFit Training',513,13,'sans-serif');line('A self-recorded training milestone.',551,10,'sans-serif');return c;}
function downloadCertificate(name){if(!state.milestone)return;const date=new Date(state.milestoneDate+'T12:00:00').toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'}),c=certificateCanvas(name,date),binary=atob(c.toDataURL('image/jpeg',.95).split(',')[1]),bytes=Uint8Array.from(binary,v=>v.charCodeAt(0));downloadFile('BFit-First-Pullup-Certificate.pdf',jpegPDF(bytes,c.width,c.height),'application/pdf');msg('Your certificate is ready. If it opens in a preview, use Share or Save to Files.');}

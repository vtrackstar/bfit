function fresh(){return {version:1,profile:null,plan:{targets:[5,5,5],top:0,loweringStreak:0,check:false,paused:false,milestone:false},history:[],draft:null};}
function decide(plan,r){
 const n=JSON.parse(JSON.stringify(plan)); n.check=false;

 if(r.pain==='yes'){n.paused=true;n.top=0;n.floorStreak=0;n.reason='Push-up practice is paused. Stop the exercise that hurts. If pain persists or returns, get advice from a qualified healthcare professional. When push-up movements are comfortable again, return to the starting check.';return n;}
 n.paused=false;
 if(r.changed){n.recheck=true;n.top=0;n.loweringStreak=0;n.floorStreak=0;n.reason='Your surface changed. Previous targets are saved as a reference. Check the new surface before your next workout.';return n;}
 if(r.effort==='position'){n.formIssues=(n.formIssues||0)+1;n.top=0;n.floorStreak=0;n.reason='Keep these targets as a reference. Next time, rest longer between sets and stop before your depth or position changes.';if(n.formIssues>=2){n.recheck=true;n.reason='Position changed in two sessions in a row. Recheck an easier surface before your next workout. Your previous targets stay in your record.';}return n;}

 if(!met||['struggle','unsure'].includes(r.effort)){n.top=0;n.floorStreak=0;n.reason='Repeat these targets. Rest longer if needed and stop before position or depth changes.';return n;}
 if(plan.milestone){const f=plan.floorTargets||[1,1,1];const fm=Array.isArray(r.floorReps)&&r.floorReps.length===3&&r.floorReps.every((v,i)=>v>=f[i]);n.floorTargets=f.slice();n.floorStreak=fm&&['easy','manageable'].includes(r.floorEffort)?(n.floorStreak||0)+1:0;if(n.floorStreak>=2){if(f.every(v=>v===5)){n.floorComplete=true;n.reason='You completed three sets of five floor push-ups in two workouts. Keep practicing or choose your next goal in the Training Hub.';}else{const i=f.indexOf(Math.min(...f));n.floorTargets[i]++;n.reason='Floor practice stayed controlled in two sessions. Add one floor repetition next time; keep your easier sets unchanged.';}n.floorStreak=0;}else n.reason=['position','struggle'].includes(r.floorEffort)?'Repeat the floor targets as an upper limit. Stop before form changes, rest longer, and record fewer reps if needed. If single reps are no longer controlled, return to the starting check. Keep easier sets unchanged.':'Repeat your floor targets until you complete them with control and about two more available in two sessions. Keep easier sets unchanged.';return n;}

}
function validState(s){const ints=a=>Array.isArray(a)&&a.length>=2&&a.length<=3&&a.every(v=>Number.isInteger(v)&&v>=0&&v<=100);const prof=p=>p&&(HEIGHTS.includes(p.height)||p.height==='Between heights')&&typeof p.name==='string'&&p.name.length<=100&&typeof p.pressing==='boolean'&&typeof p.negativeSetup==='string'&&p.negativeSetup.length<=100;return !!(s&&s.version===1&&(!s.profile||prof(s.profile))&&s.plan&&ints(s.plan.targets)&&s.plan.targets.every(v=>v>=5&&v<=8)&&Number.isInteger(s.plan.top)&&s.plan.top>=0&&Number.isInteger(s.plan.loweringStreak)&&s.plan.loweringStreak>=0&&['check','paused','milestone'].every(k=>typeof s.plan[k]==='boolean')&&(!s.plan.reason||typeof s.plan.reason==='string')&&validPauseData(s)&&validExtras(s)&&Array.isArray(s.history)&&s.history.length<=1000&&s.history.every(r=>r&&typeof r.date==='string'&&Number.isFinite(Date.parse(r.date))&&ints(r.reps)&&(!r.targets||(ints(r.targets)&&r.targets.every(v=>v>=5&&v<=8)))&&prof(r.setup)&&['easy','manageable','struggle','position','unsure'].includes(r.effort)&&['yes','no'].includes(r.pain)&&['all','some','none','skipped','replaced'].includes(r.negative)&&typeof r.changed==='boolean'&&Number.isInteger(r.singles)&&r.singles>=0&&r.singles<=3));}
function validPauseData(s){const fields=f=>f&&typeof f==='object'&&!Array.isArray(f)&&Object.keys(f).every(k=>LOG_FIELDS.includes(k)&&(['changed','negativeChanged'].includes(k)?typeof f[k]==='boolean':typeof f[k]==='string'&&f[k].length<=(k==='sessionNote'?500:100)));const record=r=>r&&typeof r.date==='string'&&Number.isFinite(Date.parse(r.date))&&fields(r.fields)&&validState({...s,plan:r.previousPlan,pauseRecord:undefined,unfinishedWorkouts:undefined,pauseContext:undefined,resumeFields:undefined});return (s.pauseRecord===undefined||record(s.pauseRecord))&&(s.unfinishedWorkouts===undefined||(Array.isArray(s.unfinishedWorkouts)&&s.unfinishedWorkouts.length<=1000&&s.unfinishedWorkouts.every(record)))&&(s.resumeFields===undefined||fields(s.resumeFields))&&(s.pauseContext===undefined||(s.pauseContext&&['setup','check','workout'].includes(s.pauseContext.source)&&['yes','unsure'].includes(s.pauseContext.answer)));}

function normalize(s){if(s.profile?.height==='Between heights'){s.profile.height='Surface around chest height';s.plan.recheck=true;s.plan.reason='Your old record used an in-between height. Choose the nearest body-part label and check that surface again.';}if(s.plan.milestone){s.plan.floorTargets=s.plan.floorTargets||[1,1,1];s.plan.floorStreak=s.plan.floorStreak||0;}return s;}
function lastSuccess(history){return [...history].reverse().find(r=>r.pain==='no'&&['easy','manageable'].includes(r.effort)&&!r.changed&&Array.isArray(r.targets)&&r.reps.length===r.targets.length&&r.reps.every((v,i)=>v>=r.targets[i]));}

const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let state=fresh(),page='start',attempts=[],pending=null,storageOK=true,timerEnd=0;
try{const raw=localStorage.getItem('bfit-first-pushup-v1');if(raw){const candidate=JSON.parse(raw);if(validState(candidate)){state=normalize(candidate);if(state.draft&&(!Array.isArray(state.draft.prefill)||state.draft.prefill.some(v=>!Number.isInteger(v)||v<0||v>5)))state.draft=null;}else storageOK=false;}localStorage.setItem('bfit-test','1');localStorage.removeItem('bfit-test')}catch{storageOK=false;}

function videoCard(key,note=''){const v=DEMO_VIDEOS[key];return `<details class="video-demo"><summary>Watch: ${esc(v.title)}</summary><p>${esc(note||'Watch how the body moves, then use the reps and rest times in this guide.')}</p><iframe class="${v.short?'short-demo':''}" loading="lazy" src="https://www.youtube-nocookie.com/embed/${v.id}" title="${esc(v.title)}${v.creator?' by '+esc(v.creator):''}" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe><p><small>${v.creator?'Video by '+esc(v.creator)+'.':'Creator credit is shown in the YouTube player and on the original video page.'} Shared here as a demonstration.</small><br><a href="https://www.youtube.com/${v.short?'shorts/':'watch?v='}${v.id}" target="_blank" rel="noopener">Open on YouTube</a></p></details>`;}

function movementHelp(){return `<div class="check-help"><h3>Before your first repetition</h3>${positionDiagram()}${page==='workout'?demoForHeight(state.profile?.height):''}<p><small>These drawings show the starting position. Open a video to see the movement.</small></p><p><b>Chest and hips move together.</b></p><ol><li>Place your hands about shoulder-width apart or a little wider. At the top, keep wrists roughly under shoulders.</li><li>Step your feet back. Keep a straight line from head to heels; spread your feet a little if it helps you stay steady.</li><li>Gently tighten your stomach and keep breathing. Bend your elbows back at an angle rather than straight out to the sides.</li><li>Bring your chest toward the surface, then push your chest and hips up together.</li></ol><p>Stop if the movement causes pain. Use a higher surface if you cannot keep the position.</p><details><summary>Why raised hands rather than knees?</summary><p>This guide uses raised hands so you can practice the straight-body movement while adjusting its difficulty. You can put your knees down to get back to the top after a slow lowering. The lowering itself uses the straight-body position.</p></details></div>`;}
function help(){return `<details><summary>Help with my position</summary><p><b>Chest and hips move together.</b> Keep the same depth each time.</p>${[['Hips sag','Gently tighten your stomach and glutes. Try a higher surface if your stomach keeps dropping.'],['Chest rises first (cobra-like press)','Push your chest and hips up together. End the set if your arms straighten while your hips stay low.'],['Hands feel too far back','At the top, start with wrists roughly beneath shoulders. Avoid tucking hands back toward your ribs.'],['Hips stay high','Bring your hips into line with shoulders and ankles.'],['Head reaches first','Keep your head aligned with your torso and let your chest lead.'],['Repetitions get shorter','End the set when you cannot maintain the same depth.']].map(([a,b])=>`<p><b>${a}</b><br>${b}</p>`).join('')}<h3>Try the starting position</h3><p>At your current surface, hold the top-of-push-up position for two comfortable breaths. Gently tighten your stomach as if preparing for a light bump. Your belly can still move as you breathe.</p><p>Rest, then try an easier push-up. If you cannot hold the position, raise the surface. If position only changes late in a set, end the set and adjust repetitions or rest. Use this to practice the position before your next rep.</p>${videoCard('tutorial','This longer E3 Rehab tutorial covers the starting position and common mistakes. Use the two-breath practice described above.')}</details>`}
function render(){document.querySelectorAll('nav button').forEach(b=>{b.setAttribute('aria-current',b.dataset.page===page?'page':'false');b.hidden=(b.dataset.page==='workout'&&!state.profile&&!state.plan.paused)||(b.dataset.page==='progress'&&!hasTrainingRecord());b.onclick=()=>go(b.dataset.page)});let html='';if(page==='start'){html=`<div class="grid"><div class="card hero"><span class="eyebrow">Start where you are</span><h1>Your first<br>push-up.</h1><p>Start with a push-up you can control. Practice twice a week and work toward your first one on the floor.</p><div class="actions"><button class="primary" onclick="go('setup')">${state.profile?'Recheck my starting point':'Find my starting point'}</button>${state.profile?`<button onclick="go('workout')">Resume my workout</button>`:''}</div><p><small>Designed by Bryan, NSCA-CSCS, NASM-CPT</small></p><span class="pill">2 sessions a week</span><span class="pill">About 15–20 minutes</span><span class="pill">Review every 8 sessions</span><p><small>When this height starts feeling easy, the guide will ask you to try a slightly lower surface.</small></p></div><aside><div class="card accent"><span class="eyebrow">The approach</span><div class="step"><span class="num">1</span><div><b>Find your surface</b><br>Try a wall or a sturdy raised surface. Start where you can move with control.</div></div><div class="step"><span class="num">2</span><div><b>Practice both parts</b><br>Practice pushing up and lowering yourself slowly.</div></div><div class="step"><span class="num">3</span><div><b>Adjust as you improve</b><br>Record what you did. See what to try next time.</div></div></div><p class="muted">Leave at least a day between sessions.</p></aside></div><div class="card"><h3>Before you start</h3><p>If you have an injury or medical restriction that affects exercise, check with your healthcare professional before starting.</p><details><summary>Research and programming notes</summary><p>I used strength-training research to inform this guide. I chose the rep targets and rules for moving on; this exact program has not been tested in a study. How long it takes will vary.</p><a href="https://pubmed.ncbi.nlm.nih.gov/29466268/" target="_blank" rel="noopener">Kotarsky et al. (2018): Progressive push-up training</a><p><small>This four-week study involved moderately trained men. It supports using push-up variations to build strength, but it did not test beginners working toward their first rep. The ACSM guidance covers resistance training generally, rather than this push-up program.</small></p><br><a href="https://pubmed.ncbi.nlm.nih.gov/21873902/" target="_blank" rel="noopener">Ebben et al. (2011): Kinetic analysis of several variations of push-ups</a><br><a href="https://pubmed.ncbi.nlm.nih.gov/41843416/" target="_blank" rel="noopener">ACSM (2026): Resistance training for healthy adults</a></details></div>`;}
if(page==='setup'){html=`<div class="grid"><div class="card"><span class="eyebrow">Starting check</span><h2>Find your starting point</h2>${state.checkProgress?`<p class="status">Your unfinished starting check is saved. Answer the pain question, then resume it.</p><button type="button" onclick="resumeCheck()">Resume saved check</button>`:''}<form id="setupForm" novalidate><label for="pain">Do push-ups or holding the starting position currently cause pain?</label><select id="pain" required><option value="">Choose an answer</option><option value="no">No</option><option value="yes">Yes</option><option value="unsure">Unsure</option></select><label for="height">Which surface will you try?</label><select id="height">${heightOptions(state.profile?.height||HEIGHTS[1])}</select><small>Stand beside a firm surface that won't slide or tip. Where does the surface reach on your body? Choose the closest label for an in-between surface. A harder surface is any stable surface slightly lower than your current one. For a wall, move your feet a little farther back.</small><p>Examples: a wall, fixed countertop, sturdy desk, secured bench, or stair. Their height depends on your body. Avoid anything that rolls, folds, slides, or tips.</p><div class="actions"><button class="primary" type="button" onclick="beginCheck(event)">Continue to movement check</button></div><p id="setupFeedback" role="alert" aria-live="assertive"></p></form></div><div class="card"><h3>How the check works</h3><p>A rep is one push-up. A set is a group of reps before you rest. Choose a surface, then adjust where you place your hands and feet.</p><ol><li>Start with a higher surface if you’re unsure. Choose a sturdy wall, fixed counter or other stable surface that will not slide or tip when you press against it.</li><li>Try up to five controlled repetitions.</li><li>Keep your chest and hips moving together.</li><li>Tell the guide how it went.</li></ol><p>Rest about two minutes before another attempt. We'll stop after three checks and count challenging attempts toward today's work.</p><details><summary>Movement instructions and position help</summary>${movementHelp()}${help()}</details></div></div><div id="checkArea"></div>`;}
if(page==='workout'){if(!state.profile&&!state.plan.paused){html=`<div class="card"><h2>Your workout starts with a short check</h2><button class="primary" onclick="go('setup')">Find my starting point</button></div>`}else if(state.plan.paused){html=`<div class="card"><h2>${state.pauseContext?.source==='setup'&&!state.profile?'Before you start':'Push-up practice is paused'}</h2><p>${esc(state.plan.reason)}</p>${state.pauseContext?.source==='workout'?`<p>Your unfinished entries are saved. This does not count as a completed workout.</p><button onclick="undoPainSelection()">I selected Yes by mistake</button>`:''}${unfinishedSummary()}<button onclick="go('setup')">Return to starting check</button></div>`}else if(state.plan.recheck){html=`<div class="card"><h2>Check your surface before the next workout</h2><p>${esc(state.plan.reason)}</p><button class="primary" onclick="go('setup')">Check my surface</button></div>`}else{const p=state.profile,plan=state.plan,d=state.draft||{};const last=state.history.at(-1);let days=last?(Date.now()-Date.parse(last.date))/86400000:99;html=`<div class="grid"><div><div class="card"><span class="eyebrow">Session ${completed()+1} • Review every 8 sessions</span><h2>Today's workout</h2><span class="pill">${esc(p.height)}</span>${p.name!==p.height?`<p><b>${esc(p.name)}</b></p>`:''}${last&&days<1?'<div class="notice">You recently logged a session. Leave at least a day between workouts; review your plan today.</div>':''}${last&&days>=7?`<div class="notice">It has been ${Math.floor(days)} days since your last log. ${days>=14?'Recheck your starting point and consider two sets.':'Repeat your last successful targets before progressing.'}<div class="actions"><button type="button" onclick="returnAfterBreak()">Plan my first workout back</button></div></div>`:''}${plan.check?'<div class="status">Your current height may be getting easier. After resting, you can check a slightly lower surface or repeat this workout.<div class="actions"><button onclick="go(\'setup\')">Check another surface</button></div></div>':''}${plan.reason?`<p class="status">${esc(plan.reason)}</p>`:''}<p>Warm up with a few easy reps. Gently tighten your stomach, keep breathing, and move your chest and hips together.</p>${p.pressing?'<details open><summary>Fit this into your existing workout</summary><p>Example: replace one chest or shoulder exercise with these sets on two existing training days. Count the lowering set too. If you had three chest or shoulder sets planned, use two push-up sets plus the lowering set. Avoid adding all these sets on top of your usual chest and shoulder work.</p><button type="button" onclick="reduce()">Use two push-up sets</button></details>':''}${d.notes?`<div class="status">${esc(d.notes)}</div>`:''}<form id="logForm"><p><b>Chest and hips move together.</b> Keep breathing and use the same depth each time.</p>${help()}<details><summary>Push-up instructions and demonstration</summary>${movementHelp()}</details>${plan.milestone?floorFields(plan):'<h3>Push-up sets</h3>'}<table><thead><tr><th>Set</th><th>Target</th><th>Completed</th></tr></thead><tbody>${plan.targets.map((v,i)=>`<tr><td>${i+1}</td><td>${v}</td><td><label class="sr" for="rep${i}">Set ${i+1} completed</label><input id="rep${i}" type="number" min="0" max="100" step="1" required value="${d.prefill?.[i]??''}" inputmode="numeric"></td></tr>`).join('')}</tbody></table><p><small>Enter the reps you actually finished. Use 0 if you skipped a set. Stop when your hips sag or you cannot lower as far as before.</small></p><div class="actions"><button type="button" onclick="startTimer()">Start 2-minute rest</button><label><input type="checkbox" id="timerSound"> Sound when rest ends</label><span class="timer" id="timer" aria-live="off">02:00</span><button type="button" onclick="timerEnd=0;updateTimer()">Reset timer</button></div><details><summary>Need an easier surface or fewer sets?</summary><p>End the affected set, rest, and use a higher surface. Record the change below. This session will not advance your targets.</p><button type="button" onclick="reduce()">Use two push-up sets</button></details><details><summary>Change surface or edit its name</summary><label for="changed"><input id="changed" type="checkbox"> I used a different surface or changed my wall distance</label><label for="actualHeight">Surface used</label><select id="actualHeight">${heightOptions(p.height)}</select><label for="actualSetup">Surface name (optional)</label><input id="actualSetup" maxlength="100" value="${esc(p.name)}"><small>Renaming alone does not change your targets. For an in-between height, choose the closest label and describe the surface here.</small></details>${!plan.milestone?`<h3 style="margin-top:24px">Lower slowly, then reset</h3><p><b>Do 1 set of 3 slow lowerings. Take about three seconds to lower yourself each time.</b> Focus on lowering yourself slowly. Use your knees or step closer to the surface to get back up. On the floor, put your knees down to help you return to the top. At a raised surface, step your feet closer before pushing back up, then step back into position.</p><details><summary>Watch the slow-lowering demonstration</summary>${videoCard('tutorial','For the floor reset, look for the slow-lowering section, labeled “Eccentric Push-Ups,” in this tutorial. Lower slowly, put your knees down, and reset. Use the three-rep target in this guide. For a raised surface, follow the step-in reset instructions above.')}</details><details><summary>Change where I lower myself slowly</summary><label for="negativeSetup">Where are you doing the slow lowering? (optional)</label><input id="negativeSetup" maxlength="100" value="${esc(p.negativeSetup)}"><label for="negativeChanged"><input type="checkbox" id="negativeChanged"> I changed the actual lowering surface</label></details><p><small>Start at your push-up height. Floor: lower to the floor, bring your knees down, and return to the top. Raised surface: keep your hands firmly in place, step in to reduce the load, and reset. Use an easier height if you cannot reset securely.</small></p>${plan.loweringStreak>=2?'<p class="status">You have been lowering yourself with control. You can try that part at a slightly lower height. Keep your regular push-ups at their current height. Keep it to three slow reps.</p>':''}<label for="negative">How did your slow-lowering set go?</label><select required id="negative"><option value="">Choose</option><option value="all">All 3 reps controlled</option><option value="some">Some reps controlled</option><option value="none">No reps controlled</option><option value="skipped">Skipped this set</option></select>`:''}<label for="effort">How did the push-up sets go?</label><select required id="effort"><option value="">Choose</option><option value="easy">Easy: I could have done several more</option><option value="manageable">Manageable: I could have done about two more with the same form</option><option value="struggle">A struggle: last rep was near my limit</option><option value="position">My hips sagged, my chest rose first, or my reps got shorter</option><option value="unsure">Unsure</option></select><label for="sessionNote">Anything to remember? (optional)</label><textarea id="sessionNote" maxlength="500" placeholder="A setup change, what felt better, or what to try next time"></textarea><p><small>Entries save on this device as you go. Use Save session when finished to add this workout to your history.</small></p><label for="logPain">Did any push-up or slow lowering cause pain?</label><select required id="logPain" onchange="showPainNotice()"><option value="">Choose</option><option value="no">No</option><option value="yes">Yes</option></select><div id="painNotice" hidden class="notice" role="alert">Stop the exercise that hurts. Your entries are saved. <button type="button" onclick="pausePressing('workout','yes')">Save entries and pause practice</button></div><div class="actions"><button class="primary" type="button" onclick="if($('logPain').value==='yes')pausePressing('workout','yes');else if(this.form.reportValidity()) logSession(event)">Save session</button></div></form></div></div><aside><div class="card accent"><h3>One cue to remember</h3><h2>Chest and hips<br>move together.</h2><p>Keep breathing. Use the same depth each time.</p></div><div class="card"><details><summary>Ready for a floor attempt?</summary>${videoCard('floor','Watch the floor push-up before your attempt. Follow the reps and rest times in this guide.')}<p>When you can do push-ups on a low surface and lower yourself slowly to the floor, try one floor push-up after warming up. Keep knees off the floor, lower until your chest lightly touches the floor, then push back up until your arms are straight. Keep your chest and hips moving together throughout. If you cannot push back up, leave floor attempts there for today. That attempt still counts as work.</p><p>After success, finish today’s practice. Next session starts with three single push-ups with rest between them and two easier sets, replacing separate lowerings.</p><button type="button" onclick="milestone()">I completed my first floor push-up</button></details><details><summary>Missed sessions and recovery</summary><p>Missed one? Resume the same targets without catch-up sets. After about a week away, repeat the last successful workout. After a longer break, recheck your setup. Delay or reduce work if soreness interferes with movement.</p></details></div></aside></div>`}}
if(page==='progress'){const n=completed();html=`<div class="grid"><div class="card"><span class="eyebrow">Your training record</span><h2>Your progress</h2><p>Work toward eight push-ups in each set. When you reach that target with control in two sessions, you can try a slightly lower surface. You can also try sooner if your sets feel easy.</p><div class="metric">${n} <span style="font-size:18px;letter-spacing:0">completed sessions</span></div><p>${n%8} of 8 sessions toward your next review${n&&n%8===0?' • Review ready':''}</p>${state.plan.milestone?`<div class="card accent"><h3>You did your first floor push-up.</h3><button onclick="go('completionDraft')">Get my certificate</button><p>Next goal: build controlled sets. Floor targets: ${(state.plan.floorTargets||[1,1,1]).join(' / ')}.</p><p>${state.plan.floorComplete?'Three sets of five confirmed. Choose your next goal when ready.':'Complete the floor targets with control twice before adding one rep. The goal is three sets of five; there is no deadline.'}</p></div>`:''}<div class="status">${esc(state.plan.reason||'Complete your starting check to get your first workout.')}</div>${state.profile&&!state.plan.paused&&!state.plan.recheck?`<h3>Next targets: ${state.plan.targets.join(' / ')}</h3><p>${esc(setupLabel(state.profile))}</p><button class="primary" onclick="go('workout')">View next workout</button>`:''}${state.plan.paused?`<button onclick="go('workout')">See why practice is paused</button>`:state.plan.recheck||!state.profile?`<button class="primary" onclick="go('setup')">Start my next check</button>`:''}${state.calibrationNotes?.length?`<p><a class="primary" href="https://vtrackstar.github.io/bfit/">Explore other training options</a></p><details><summary>Saved starting practice</summary>${state.calibrationNotes.map(a=>`<p>${esc(a.height)}: ${esc(a.reps)} reps • ${esc(recordLabel(a.result))}</p>`).join('')}</details>`:''}${n>=8?'<details open><summary>Eight-session review</summary><p>Look back at your first workouts. Can you do more reps at the same height, lower yourself more slowly, or use a lower surface? Keep working from your current targets. If you are stuck, check whether you are resting enough and practicing regularly. Compare reps at the same height; a lower surface makes each rep harder.</p></details>':''}</div><div class="card"><h3>Keep your progress</h3>${hasTrainingRecord()?'<button onclick="downloadTrainingLog()">Download my training log</button>':''}<p>Download a backup to move to another device. Restoring replaces the current record after you confirm.</p><button onclick="download()">Download backup</button><label for="importFile">Restore a backup</label><input id="importFile" type="file" accept="application/json,.json"><div id="importArea"></div><details><summary>Start a separate practice run</summary><p>Download a backup first. This clears the record in this browser.</p><button onclick="resetAll()">Clear this practice record</button></details></div></div><div class="card">${unfinishedSummary()}${state.unfinishedWorkouts?.length?`<p>${state.unfinishedWorkouts.length} earlier unfinished workout record(s) retained in your backup.</p>`:''}<h3>Session history</h3>${state.history.length?state.history.slice().reverse().map(r=>`<details><summary>${new Date(r.date).toLocaleDateString()} • ${esc(r.reps.join(' / '))}${r.pain==='yes'?' • stopped for pain':''}</summary><p>Targets: ${esc((r.targets||[]).join(' / '))}<br>${esc(setupLabel(r.setup))}<br>Effort: ${esc(recordLabel(r.effort))}<br>Slow lowering: ${esc(recordLabel(r.negative))} • ${esc(r.setup.negativeSetup)}<br>Floor practice: ${r.floorReps?esc(r.floorReps.join(' / ')):r.singles?r.singles+' individual floor reps':'Not recorded'}</p>${r.note?`<p>Note: ${esc(r.note)}</p>`:''}</details>`).join(''):'<p>Your saved workouts will appear here. Look back at the height you used, the reps you finished, and how they felt.</p>'}</div>`;}
if(page==='completionDraft')html=completionDraft();$('view').innerHTML=html;restoreLogFields();if($('painNotice'))$('painNotice').hidden=$('logPain')?.value!=='yes';enhanceChoices();if($('certificateForm'))$('certificateForm').oninput=()=>{if($('certificateDate').value){state.certificate={name:$('certificateName').value,date:$('certificateDate').value};save();}};storageLabel();if($('setupForm'))$('setupForm').onsubmit=beginCheck;if($('logForm')){$('logForm').onsubmit=logSession;$('logForm').oninput=autosaveWorkout;$('logForm').addEventListener('change',autosaveWorkout);}if($('importFile'))$('importFile').onchange=importBackup;}
function completionFireworks(){const colors=['#237b65','#b59a54','#579ac3'];return '<div class="completion-fireworks" aria-hidden="true">'+[0,1,2].map(b=>Array.from({length:12},(_,i)=>{const angle=i*Math.PI/6;return `<i style="--x:${[20,75,48][b]}%;--y:${[75,100,55][b]}px;--dx:${Math.round(Math.cos(angle)*95)}px;--dy:${Math.round(Math.sin(angle)*95)}px;--delay:${b*.35}s;--spark:${colors[i%3]}"></i>`}).join('')).join('')+'</div>';}
function completionDraft(){return `<div class="card accent completion-celebration">${completionFireworks()}<span class="eyebrow">You did it!</span><h2>Congratulations!</h2><p><b>You did your first floor push-up!</b></p><p>Your practice paid off. Take a moment to enjoy it, then save your certificate. You earned this.</p><form id="certificateForm" onsubmit="event.preventDefault();downloadCertificate()"><label for="certificateName">Name on your certificate</label><input id="certificateName" required maxlength="70" autocomplete="name" value="${esc(state.certificate?.name||'')}"><label for="certificateDate">Date of your first floor push-up</label><input id="certificateDate" type="date" required value="${esc(state.certificate?.date||localDate(state.milestoneDate))}" max="${localDate()}"><button class="primary" style="margin-top:16px">Download my certificate</button></form><p><small>Your certificate celebrates your self-recorded first floor push-up.</small></p></div>${trainingDownloads()}<div class="card"><h2>Your free technique-review voucher</h2><p><b>Your voucher has no expiration date.</b> Completing this guide earns you one free review of a weight-room exercise or athletic movement you want help improving.</p><p>Reviews are currently paused while I finish setting up intake. Keep your certificate and continue practicing with the guide.</p><p><small>One free technique review per person. Check back here for submission details when reviews reopen.</small></p></div><div class="actions"><button onclick="go('workout')">Continue my push-up practice</button><button onclick="go('progress')">View my progress</button></div>`;}

function hasTrainingRecord(){return !!(state.checkProgress||state.profile||state.history.length||state.calibrationNotes?.length||state.pauseRecord||state.unfinishedWorkouts?.length||state.draft||state.resumeFields);}
function trainingLogText(s){
 const lines=['BFit | Your First Push-Up','My training record','Downloaded: '+new Date().toLocaleDateString(),''];
 const words={easy:'Easy',manageable:'Manageable',struggle:'Near my limit',position:'Position or depth changed',unsure:'Unsure',all:'All three controlled',some:'Some controlled',none:'None controlled',skipped:'Skipped',replaced:'Replaced by floor practice',yes:'Yes',no:'No',hard:'Too hard',pain:'Pain reported'};
 const date=v=>v&&!isNaN(Date.parse(v))?new Date(v).toLocaleDateString(): 'Date not recorded';
 const add=(label,v)=>{if(v!==undefined&&v!==null&&String(v).trim()!=='')lines.push(label+': '+(Array.isArray(v)?v.join(' / '):words[v]||v));};
 function record(title,r,partial=false){lines.push(title+' • '+date(r.date));const f=r.fields||r;const setup=r.setup||{};add('Setup',f.actualSetup||setup.name);if(setup.height!==setup.name)add('Surface height',f.actualHeight||setup.height);add('Planned push-ups',r.targets||r.previousPlan?.targets);add('Completed push-ups',r.reps||[f.rep0,f.rep1,f.rep2].map(v=>v===''||v==null?'—':v));add('Floor push-ups',r.floorReps||(f.floor0!==undefined?[f.floor0,f.floor1,f.floor2].map(v=>v===''||v==null?'—':v):undefined));add('Effort',f.effort);add('Floor effort',f.floorEffort);add('Slow lowering setup',f.negativeSetup||setup.negativeSetup);add('Slow lowering result',f.negative);add('Pain reported',f.logPain||f.pain);add('Note',f.sessionNote||f.note);if(partial)lines.push('Unfinished: these entries do not count as a completed workout.');lines.push('');}
 if(s.milestoneDate){add('First floor push-up',date(s.milestoneDate));lines.push('');}
 (s.history||[]).forEach((r,i)=>record('SESSION '+(i+1),r));
 const checks=s.checkProgress?.attempts||s.calibrationNotes||[];
 checks.forEach((r,i)=>{lines.push('STARTING PRACTICE '+(i+1));add('Setup',r.name||r.height);add('Repetitions',r.reps);add('How it felt',r.result);lines.push('');});
 if(s.checkProgress&&!s.checkProgress.recorded){lines.push('UNFINISHED STARTING CHECK');add('Setup',s.checkProgress.pending?.name);add('Repetitions',s.checkProgress.reps);add('How it felt',s.checkProgress.result);lines.push('');}
 (s.unfinishedWorkouts||[]).forEach(r=>record('EARLIER UNFINISHED WORKOUT',r,true));
 if(s.pauseRecord)record('PAUSED WORKOUT',s.pauseRecord,true);
 else if(s.resumeFields)record('UNFINISHED WORKOUT',{date:s.entriesUpdatedAt,fields:s.resumeFields,previousPlan:s.plan},true);
 else if(s.draft?.prefill)record('UNFINISHED WORKOUT',{setup:s.profile,targets:s.plan.targets,reps:s.draft.prefill,note:s.draft.notes},true);
 lines.push('Only your recorded entries are included. Keep the separate backup file to restore progress in the guide.');return lines.join('\n');
}
function downloadTrainingLog(){if(!hasTrainingRecord()){msg('No training entries have been saved yet.');return;}const url=URL.createObjectURL(new Blob([trainingLogText(state)],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='BFit_Pushup_Training_Log.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function trainingDownloads(){return hasTrainingRecord()?`<div class="card"><h3>Keep your training record</h3><p>Download your saved sessions, setup, and practice notes. Your log also includes any saved unfinished workout entries.</p><div class="actions"><button onclick="downloadTrainingLog()">Download my training log</button><button onclick="download()">Download backup to restore later</button></div><p><small>The training log is a readable text file. The backup saves your guide data for restoring on another device.</small></p></div>`:'';}
function completed(){return state.history.filter(r=>r.pain==='no'&&r.reps.filter(v=>v>0).length>=2).length}
function beginCheck(e){e.preventDefault();if(attempts.length>=3){endCalibration();return;}if(!$('pain').value){$('setupFeedback').textContent='Choose an answer to the pain question before continuing.';$('pain').focus();return;}if($('pain').value!=='no'){pausePressing('setup',$('pain').value);return;}$('setupFeedback').textContent='';if(state.plan.paused){state.plan.paused=false;state.plan.recheck=true;delete state.pauseContext;state.plan.reason='You answered No to pain. Finish the starting check before returning to your workouts.';save();}msg('');pending={height:$('height').value,name:$('height').value,pressing:state.profile?.pressing||false};if(!pending.name)return;const a=$('checkArea');$('setupForm').closest('.grid').hidden=true;a.innerHTML=`<div class="card"><h2 id="checkHeading" tabindex="-1">Try up to five controlled repetitions</h2><p>${esc(pending.name===pending.height?pending.height:pending.height+' • '+pending.name)}</p><p>Lower for about two seconds. Move your chest and hips together, then press back up. Stop if your hips sag, your reps get shorter, or the movement hurts.</p><p>Hands about shoulder-width apart, wrists under shoulders. Step your feet back, gently tighten your stomach, and keep breathing.</p><details><summary>Show the starting position and demonstration</summary>${positionDiagram()}${demoForHeight(pending.height)}</details>${checkTimer()}<label for="checkReps">Repetitions completed</label><input id="checkReps" type="number" min="0" max="5" step="1" value="" oninput="saveCheckInputs()"><label for="checkResult">How did it go?</label><select id="checkResult" onchange="saveCheckInputs()"><option value="">Choose an answer</option><option value="manageable">Manageable: I could have done about two more</option><option value="easy">Easy: I could have done several more</option><option value="hard">Too hard or couldn't finish</option><option value="position">My hips sagged, my chest rose first, or my reps got shorter</option><option value="unsure">Unsure</option><option value="pain">It hurt</option></select><button id="recordCheck" class="primary" onclick="finishCheck()" style="margin-top:18px">Record check</button><p>Attempt ${attempts.length+1} of 3. Rest about two minutes between attempts.</p><div id="checkAdvice"></div></div>`;a.scrollIntoView({behavior:'auto'});$('checkHeading').focus({preventScroll:true});state.checkProgress={attempts:attempts.slice(),pending:{...pending},reps:'',result:'',recorded:false};save();}
function finishCheck(){if($('checkReps').value.trim()===''||!['manageable','easy','hard','position','unsure','pain'].includes($('checkResult').value)){msg('Enter your completed repetitions and choose how the check felt.');return;}let reps=Number($('checkReps').value),result=$('checkResult').value;if(!Number.isInteger(reps)||reps<0||reps>5){msg('Enter 0–5 completed repetitions.');return;}if(reps<5&&['easy','manageable'].includes(result))result='hard';$('recordCheck').disabled=true;attempts.push({...pending,reps,result});state.checkProgress={attempts:attempts.slice(),pending:{...pending},reps:String(reps),result,recorded:true};save();if(result==='pain'){pausePressing('check','yes');return;}if(['manageable','easy'].includes(result)&&reps===5&&pending.height==='Floor'&&!state.plan.milestone){$('checkAdvice').innerHTML=`<h3>You can already do floor push-ups!</h3><p>You completed five controlled reps, so you already meet this guide’s goal. Save today’s check and choose your next training goal in the Hub.</p><button onclick="saveExistingFloor()">Save my check</button><p><a href="https://vtrackstar.github.io/bfit/">Explore the Training Hub</a></p>`;return;}if(['manageable','easy'].includes(result)&&reps===5){$('checkAdvice').innerHTML=`<p class="status">${result==='easy'?'This may be an easy starting surface. You can keep it for today or check a slightly harder available setup.':'This is your starting surface.'}</p><label for="setupName">Name this surface (optional)</label><input id="setupName" maxlength="100" placeholder="Kitchen counter; wall with feet one step back" value="${esc(state.profile?.name||'')}"><label for="pressing">Does your current workout already include push-ups, chest presses, shoulder presses, or dips?</label><select id="pressing"><option value="no">No</option><option value="yes" ${state.profile?.pressing?'selected':''}>Yes</option></select><p>Accepting this surface starts at five reps per push-up set. Today’s check counts toward the workout. A different function saveCheckInputs(){if(!pending)return;state.checkProgress={attempts:attempts.slice(),pending:{...pending},reps:$('checkReps').value,result:$('checkResult').value,recorded:false};save();}
function resumeCheck(){if($('pain').value!=='no'){beginCheck({preventDefault(){}});return;}const c=state.checkProgress;if(!c)return;attempts=c.attempts.slice();if(c.recorded)attempts.pop();$('height').value=c.pending.height;beginCheck({preventDefault(){}});$('checkReps').value=c.reps;$('checkResult').value=c.result;saveCheckInputs();if(c.recorded)finishCheck();}
function checkTimer(){return `<div class="actions"><button type="button" onclick="startTimer()">Start 2-minute rest</button><span class="timer" id="timer" aria-live="off">02:00</span><label><input type="checkbox" id="timerSound"> Sound when rest ends</label></div>`;}
function retryCheck(){$('setupForm').closest('.grid').hidden=false;$('checkArea').innerHTML=checkTimer();$('setupForm').scrollIntoView({behavior:'smooth'});msg('Rest about two minutes, then choose the height you want to try next.');}
function saveExistingFloor(){state.calibrationNotes=attempts.slice();delete state.checkProgress;state.plan.reason='You completed five floor push-ups in your starting check. You already meet this guide’s goal. Explore the Training Hub for your next goal.';attempts=[];save();go('progress');}
function endCalibration(){delete state.checkProgress;state.calibrationNotes=attempts.slice();state.nextCheck='You completed today’s starting practice. Next visit: use a higher firm surface, or stand closer to the wall. Try up to five controlled reps after resting at least a day. If that is still too difficult, stop and ask a qualified trainer to help you choose a starting movement. You can also explore the Training Hub for other ways to get started.';state.plan.recheck=true;state.plan.reason=state.nextCheck;state.draft=null;save();attempts=[];go('progress');msg('Today’s practice is saved.');}
function acceptCheck(){delete state.checkProgress;const oldFloor=state.plan.floorTargets;const hadMilestone=state.plan.milestone;const last=attempts.at(-1),hard=attempts.filter(a=>a.result!=='easy').length;last.name=$('setupName')?.value.trim()||last.height;last.pressing=$('pressing')?.value==='yes';state.nextCheck='';delete state.resumeFields;delete state.pauseContext;state.profile={height:last.height,name:last.name,pressing:last.pressing,negativeSetup:last.name};state.plan={targets:[5,5,5],top:0,loweringStreak:0,check:false,paused:false,milestone:hadMilestone,floorTargets:oldFloor||[1,1,1],floorStreak:0};if(hadMilestone)state.plan.targets=[5,5];if(last.height==='Floor'){state.milestoneDate=state.milestoneDate||new Date().toISOString();state.plan.milestone=true;state.plan.recheck=true;state.plan.reason='Floor push-ups achieved. Check an easier raised surface for your supporting sets before beginning floor practice.';state.draft=null;attempts=[];save();go('progress');return;}if(hard>=3){state.draft=null;state.calibrationNotes=attempts;attempts=[];state.plan.reason='Starting setup saved. Your starting checks were enough work today. Start your workout next session.';save();go('progress');msg('Starting practice complete. Rest before your first workout.');return;}else if(hard===2){state.plan.targets=[5,5];state.draft={prefill:[last.reps],notes:'Earlier challenging attempts count toward today’s workload. Complete only one more working set; keep lowering practice easy or skip if tired.'};}else state.draft={prefill:[last.reps],notes:'Your completed five-repetition check is set 1.'};if(hadMilestone&&last.height!=='Floor'){state.plan.milestone=true;state.plan.targets=[5,5];state.draft=null;}if(last.height==='Floor'){state.milestoneDate=state.milestoneDate||new Date().toISOString();state.plan.milestone=true;state.plan.targets=[5,5];state.plan.reason='Floor push-ups already achieved. Choose an easier surface for the supporting sets before starting the singles transition.';state.draft=null;attempts=[];save();go('progress');msg('Floor milestone recorded. Recheck an easier surface for your supporting sets.');return;}attempts=[];save();go('workout');msg('Starting setup saved.');}
function reduce(){if(state.plan.targets.length===2)return;autosaveWorkout();state.plan.targets=state.plan.targets.slice(0,2);save();render();msg('Using two push-up sets. Your entries for these sets are kept.');}
function returnAfterBreak(){const last=state.history.at(-1);if(!last)return;const days=(Date.now()-Date.parse(last.date))/86400000;if(days>=14){state.plan.recheck=true;state.plan.reason='After this longer break, check your starting surface again.';state.draft=null;save();go('setup');return;}const success=lastSuccess(state.history);if(success){state.profile=JSON.parse(JSON.stringify(success.setup));state.plan.targets=success.targets.slice();if(state.plan.milestone)state.plan.targets=state.plan.targets.slice(0,2);state.plan.reason='Start with the reps you last completed comfortably. Build from there.';}else{state.plan.recheck=true;state.plan.reason='Your log does not yet show a completed workout that felt manageable. Start with a fresh check.';}state.plan.check=false;state.plan.top=0;state.plan.floorStreak=0;state.draft=null;save();render();msg(state.plan.reason);}
function logSession(e){e.preventDefault();if($('logPain').value==='yes'){pausePressing('workout','yes');return;}const reps=state.plan.targets.map((_,i)=>Number($('rep'+i).value));let name=$('actualSetup').value.trim()||state.profile.name,neg=state.plan.milestone?state.profile.negativeSetup:($('negativeSetup').value.trim()||state.profile.negativeSetup);const height=$('actualHeight').value;const changed=$('changed').checked||height!==state.profile.height;const r={date:new Date().toISOString(),targets:state.plan.targets.slice(),reps,setup:{...state.profile,height,name,negativeSetup:neg},effort:$('effort').value,pain:$('logPain').value,negative:state.plan.milestone?'replaced':$('negative').value,changed,note:$('sessionNote')?.value.trim()||'',singles:0,...(state.plan.milestone?{floorReps:[0,1,2].map(i=>Number($('floor'+i).value)),floorEffort:$('floorEffort').value}:{})};const next=decide(state.plan,r);if(!next.paused&&!next.recheck&&r.effort!=='position'&&state.draft?.notes?.startsWith('Earlier challenging')){next.targets=state.plan.targets.slice();next.check=false;next.reason='Starting checks used part of this session. Confirm these targets next time before progressing.';}if(!next.paused&&!next.recheck&&r.effort!=='position'&&$('negativeChanged')?.checked){next.loweringStreak=0;next.targets=state.plan.targets.slice();next.check=false;next.reason='Lowering setup changed. Keep push-up targets unchanged while you confirm control.';}if(r.pain==='yes'){next.paused=true;next.reason='Push-up practice is paused because pain was reported.';}delete state.resumeFields;state.history.push(r);state.profile=r.setup;state.plan=next;state.draft=null;save();go('progress');msg('Session saved.');}
function milestone(){if(!state.profile||state.plan.paused||state.plan.recheck){go('setup');return;}if(state.plan.milestone){go('progress');return;}msg('');$('view').innerHTML=`<div class="card"><h2>Record your first floor push-up</h2><p>Did you keep your knees off the floor, lower until your chest lightly touched the floor, then push back up to straight arms with your chest and hips moving together?</p><button class="primary" onclick="confirmMilestone()">Yes, record my first rep</button> <button onclick="go('workout')">Back to my workout</button></div>`;}
function confirmMilestone(){if(!state.profile||state.plan.paused||state.plan.recheck)return;if(state.resumeFields){state.unfinishedWorkouts=state.unfinishedWorkouts||[];state.unfinishedWorkouts.push({date:state.entriesUpdatedAt||new Date().toISOString(),fields:{...state.resumeFields},previousPlan:JSON.parse(JSON.stringify(state.plan))});delete state.resumeFields;}state.milestoneDate=state.milestoneDate||new Date().toISOString();state.plan.milestone=true;state.plan.targets=[5,5];state.plan.floorTargets=[1,1,1];state.plan.floorStreak=0;state.plan.check=false;state.plan.reason='You did your first floor push-up. Next session: three single push-ups with rest between them, followed by two easier sets. These floor reps replace the separate slow-lowering set. Rest today; this attempt counts toward your work.';state.draft=null;save();go('completionDraft');}
function showPainNotice(){const el=$('painNotice');if(el)el.hidden=$('logPain')?.value!=='yes';autosaveWorkout();}
function pausePressing(source='check',answer='yes'){
 if(state.plan.paused)return;
 if(source==='workout'){
 const fields={};for(const id of LOG_FIELDS){const el=$(id);if(el)fields[id]=el.type==='checkbox'?el.checked:el.value;}
 if(state.pauseRecord){state.unfinishedWorkouts=state.unfinishedWorkouts||[];state.unfinishedWorkouts.push(state.pauseRecord);}state.pauseRecord={date:new Date().toISOString(),fields,previousPlan:JSON.parse(JSON.stringify(state.plan))};
 }
 state.pauseContext={source,answer};state.plan.paused=true;state.plan.top=0;state.plan.floorStreak=0;
 state.plan.reason=source==='setup'&&!state.profile?(answer==='unsure'?'You do not need to test a movement you are unsure about. Leave the check here for now. Ask a qualified healthcare professional if you are unsure whether pain or an injury affects your ability to start.':'You reported pain with push-up movements. Leave the check here for now. Get advice from a qualified healthcare professional if the pain persists or returns.'):answer==='unsure'?'If you are unsure whether the movement hurts, stop the check for now. If you remain unsure, ask a qualified healthcare professional before trying again. Return to the starting check when you can answer the pain question.':'Push-up practice is paused. Stop the exercise that hurts. If pain persists or returns, get advice from a qualified healthcare professional. When push-up movements are comfortable again, return to the starting check.';
 if(attempts.length)state.calibrationNotes=attempts.slice();delete state.checkProgress;attempts=[];save();go('workout');
}
function unfinishedSummary(){const r=state.pauseRecord;if(!r)return '';return `<details><summary>Saved unfinished workout</summary><p>${esc(new Date(r.date).toLocaleDateString())} • stopped before completion</p><p>Push-up reps entered: ${[0,1,2].filter(i=>r.fields['rep'+i]!==undefined).map(i=>esc(r.fields['rep'+i]||'not entered')).join(' / ')}</p>${r.fields.floor0!==undefined?`<p>Floor reps entered: ${[0,1,2].map(i=>esc(r.fields['floor'+i]||'not entered')).join(' / ')}</p>`:''}<p>Support: ${esc(r.fields.actualHeight||'not entered')} • ${esc(r.fields.actualSetup||'unnamed')}</p><p>Effort: ${esc(recordLabel(r.fields.effort))} • Slow lowering: ${esc(recordLabel(r.fields.negative))}</p></details>`;}
function undoPainSelection(){if(!state.plan.paused||state.pauseContext?.source!=='workout'||!state.pauseRecord)return;state.plan=JSON.parse(JSON.stringify(state.pauseRecord.previousPlan));state.resumeFields={...state.pauseRecord.fields,logPain:''};delete state.pauseRecord;delete state.pauseContext;save();go('workout');msg('Your entries are restored. Answer the pain question again before saving.');}
function autosaveWorkout(){if(page!=='workout'||state.plan.paused||!$('logForm'))return;const fields={};for(const id of LOG_FIELDS){const el=$(id);if(el)fields[id]=el.type==='checkbox'?el.checked:el.value;}state.resumeFields=fields;state.entriesUpdatedAt=new Date().toISOString();save();}
function restoreLogFields(){if(page!=='workout'||state.plan.paused||state.plan.recheck||!state.resumeFields)return;for(const id of LOG_FIELDS){const el=$(id),v=state.resumeFields[id];if(!el||v===undefined)continue;if(el.type==='checkbox')el.checked=v;else el.value=v;}}

function floorFields(plan){const f=plan.floorTargets||[1,1,1];return `<h3>Floor practice: ${f.join(' / ')}</h3><p>Each number is one set. Rest about two minutes between sets. Stop before depth or position changes. These sets replace separate lowerings. After two controlled sessions with about two reps available, add one total floor rep, working toward three sets of five.</p>${f.map((v,i)=>`<label for="floor${i}">Floor set ${i+1}: target ${v}</label><input id="floor${i}" type="number" min="0" max="100" step="1" required inputmode="numeric">`).join('')}<label for="floorEffort">How did the floor sets go?</label><select id="floorEffort" required><option value="">Choose</option><option value="easy">Easy</option><option value="manageable">I kept my form and could have done about two more</option><option value="struggle">Near my limit</option><option value="position">My hips sagged, my chest rose first, or my reps got shorter</option><option value="unsure">Unsure</option></select><h3>Easier push-up sets</h3>`;}

function download(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='BFit_Pushup_Progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function importBackup(e){const file=e.target.files[0];if(!file)return;try{if(file.size>1000000)throw Error();const candidate=JSON.parse(await file.text());if(!validState(candidate))throw Error();const area=$('importArea');area.innerHTML=`<p class="status">Backup: ${candidate.history.length} logged sessions${candidate.profile?' • '+esc(candidate.profile.name):''}. Replace this browser’s current record?</p><button id="confirmImport">Replace with this backup</button><button id="cancelImport">Cancel</button>`;$('confirmImport').onclick=()=>{state=normalize(candidate);attempts=state.checkProgress?.attempts?.slice()||[];pending=null;timerEnd=0;save();go('progress');msg('Backup restored.');};$('cancelImport').onclick=()=>{area.innerHTML='';e.target.value='';};}catch{msg('This backup is invalid or unsupported. Your current progress has not changed.');}}
function resetAll(){if(confirm('Clear this browser’s practice record? Download a backup first.')){state=fresh();attempts=[];pending=null;timerEnd=0;save();go('start');msg('Practice record cleared.')}}
function enhanceChoices(){
 for(const id of ['effort','logPain','floorEffort','negative']){const select=$(id);if(!select)continue;const label=document.querySelector('label[for="'+id+'"]');const group=document.createElement('fieldset');group.className='tap-options';const legend=document.createElement('legend');legend.textContent=label?.textContent||id;group.appendChild(legend);
 for(const option of select.options){if(!option.value)continue;const row=document.createElement('label'),radio=document.createElement('input');radio.type='radio';radio.name=id+'Choice';radio.value=option.value;radio.required=true;radio.checked=select.value===option.value;radio.addEventListener('change',()=>{select.value=radio.value;select.dispatchEvent(new Event('change',{bubbles:true}));});row.append(radio,document.createTextNode(option.textContent));group.appendChild(row);}select.required=false;select.hidden=true;if(label)label.hidden=true;select.after(group);
 }
}
let timerAudio=null;
function prepareTimerSound(){if(!$('timerSound')?.checked)return;try{timerAudio=timerAudio||new(window.AudioContext||window.webkitAudioContext)();timerAudio.resume();}catch(e){msg('Sound is unavailable in this browser. Keep the timer visible.');}}
function playTimerSound(){if(!$('timerSound')?.checked||!timerAudio)return;try{const o=timerAudio.createOscillator(),g=timerAudio.createGain();o.connect(g);g.connect(timerAudio.destination);o.frequency.value=660;g.gain.setValueAtTime(.15,timerAudio.currentTime);g.gain.exponentialRampToValueAtTime(.001,timerAudio.currentTime+.7);o.start();o.stop(timerAudio.currentTime+.7);}catch(e){}}
function localDate(value){const d=value?new Date(value):new Date();return isNaN(d)?'':`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function jpegPDF(bytes,width,height){
 const enc=new TextEncoder(),parts=[],offsets=[0];let size=0;const push=x=>{const v=typeof x==='string'?enc.encode(x):x;parts.push(v);size+=v.length;};
 push('%PDF-1.4\n');const obj=(n,body)=>{offsets[n]=size;push(n+' 0 obj\n'+body+'\nendobj\n');};
 obj(1,'<< /Type /Catalog /Pages 2 0 R >>');obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');obj(3,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 792 612] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>');
 offsets[4]=size;push('4 0 obj\n<< /Type /XObject /Subtype /Image /Width '+width+' /Height '+height+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+bytes.length+' >>\nstream\n');push(bytes);push('\nendstream\nendobj\n');
 const stream='q 792 0 0 612 0 0 cm /Im0 Do Q';obj(5,'<< /Length '+stream.length+' >>\nstream\n'+stream+'\nendstream');const start=size;push('xref\n0 6\n0000000000 65535 f \n');for(let i=1;i<=5;i++)push(String(offsets[i]).padStart(10,'0')+' 00000 n \n');push('trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+start+'\n%%EOF');return new Blob(parts,{type:'application/pdf'});
}
function certificateCanvas(name,date){const c=document.createElement('canvas');c.width=2376;c.height=1836;const x=c.getContext('2d');x.scale(3,3);x.fillStyle='#f8f6ee';x.fillRect(0,0,792,612);x.strokeStyle='#234e41';x.lineWidth=3;x.strokeRect(25,25,742,562);x.strokeStyle='#b59a54';x.lineWidth=1;x.strokeRect(35,35,722,542);x.textAlign='center';x.fillStyle='#234e41';const line=(text,y,size,font='Georgia')=>{x.font=size+'px '+font;x.fillText(text,396,y);};line('BFit',93,33,'sans-serif');line('CERTIFICATE OF COMPLETION',144,14,'sans-serif');line('Your First Push-Up',197,39);line('Presented to',242,13,'sans-serif');let size=36;x.font=size+'px Georgia';while(x.measureText(name).width>640&&size>14){size--;x.font=size+'px Georgia';}x.fillText(name,396,292);x.strokeStyle='#b59a54';x.beginPath();x.moveTo(160,310);x.lineTo(632,310);x.stroke();line('For completing your first floor push-up',352,19);line('and the practice that brought you here.',380,17);line(date,424,17,'sans-serif');line('Bryan | NSCA-CSCS, NASM-CPT',489,15,'sans-serif');line('BFit Training',513,13,'sans-serif');line('A self-recorded training milestone.',551,10,'sans-serif');return c;}
function downloadCertificate(){if(!state.plan.milestone){msg('Record your first floor push-up before downloading a certificate.');return;}const form=$('certificateForm');if(!form.reportValidity())return;const name=$('certificateName').value.trim(),date=$('certificateDate').value;if(!name){msg('Enter the name you want on your certificate.');return;}state.certificate={name,date};save();const pretty=new Date(date+'T12:00:00').toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'});const c=certificateCanvas(name,pretty),binary=atob(c.toDataURL('image/jpeg',.95).split(',')[1]),bytes=Uint8Array.from(binary,v=>v.charCodeAt(0));const url=URL.createObjectURL(jpegPDF(bytes,c.width,c.height)),a=document.createElement('a');a.href=url;a.download='BFit_First_Pushup_Certificate.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);msg('Your certificate is ready. If it opens in a preview, use Share or Save to Files.');}

function startTimer(){prepareTimerSound();timerEnd=Date.now()+120000;updateTimer()}
function updateTimer(){const el=$('timer');if(!el)return;let sec=timerEnd?Math.max(0,Math.ceil((timerEnd-Date.now())/1000)):120;el.textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');if(timerEnd&&sec===0){timerEnd=0;playTimerSound();msg('Rest timer finished. Take longer if you need it.');}}
setInterval(updateTimer,500);page=routePage();if(page==='completionDraft'&&!state.plan.milestone)page='progress';history.replaceState(null,'','#'+page);render();$('scriptNotice').hidden=true;
</script></body></html>
